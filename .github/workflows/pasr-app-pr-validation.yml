name: Pasr apps PR checks
on:
  pull_request:
    branches: [main]
    paths:
      - "App/**"
      - "Shared/**"
      - "Watch/**"
      - "Widgets/**"
      - "Pasr.xcodeproj/**"
      - "zakelijk/apple/**"
      - "website/**"
      - "preview/**"
      - "tools/make_zakelijk.py"
      - "tools/verify_zakelijk_dashboard.py"
      - "supabase/**"
      - ".github/workflows/backend.yml"
      - "android/pasr/**"
      - "android/zakelijk/**"
      - ".github/workflows/android-*.yml"
      - ".github/workflows/xcode-*.yml"
      - ".github/workflows/pasr-app-pr-validation.yml"
  workflow_dispatch:

concurrency:
  group: pasr-app-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pasr-test-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the actual isolated test pages
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow python-barcode
          python3 tools/make_website.py
          python3 preview/build_preview.py
          node --check preview/pasr-preview.js
          python3 -m py_compile preview/build_preview.py
          test -f website/test/assets/pasr-preview.css
          test -f website/test/zakelijk/index.html

  zakelijk-website-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all website tabs and feature controllers
        run: |
          python3 tools/verify_zakelijk_dashboard.py
          python3 tools/make_zakelijk.py
          python3 tools/verify_zakelijk_dashboard.py
          node --check website/assets/zakelijk.js
          node --check website/assets/promo-codes-business.js
          node --check website/assets/loyalty2.js
          node --check website/assets/promo-codes-business.js
          python3 -m py_compile tools/make_zakelijk.py

  version-and-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exact app versions and build numbers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Pasr.xcodeproj/project.pbxproj").read_text()
          z = Path("zakelijk/apple/PasrZakelijk.xcodeproj/project.pbxproj").read_text()
          g = Path("zakelijk/apple/make_project.py").read_text()
          ap = Path("android/pasr/app/build.gradle.kts").read_text()
          az = Path("android/zakelijk/app/build.gradle.kts").read_text()
          assert p.count('CURRENT_PROJECT_VERSION = "66";') == 6
          assert p.count('MARKETING_VERSION = "1.0.5";') == 6
          # Pasr Zakelijk: iOS-app, iOS-widgets, Mac-app en Mac-widgets, elk Debug + Release, allemaal dezelfde versie
          assert z.count('CURRENT_PROJECT_VERSION = "21";') == 8
          assert z.count('MARKETING_VERSION = "1.0.4";') == 8
          assert z.count('CURRENT_PROJECT_VERSION =') == 8 and z.count('MARKETING_VERSION =') == 8
          assert z.count('PRODUCT_BUNDLE_IDENTIFIER = app.lrvdlinden.pasrzakelijk;') == 4  # iOS en Mac: universal purchase
          assert 'BUILD = "21"' in g and 'VERSION = "1.0.4"' in g
          assert 'VERSION_NAME") ?: "1.0.5"' in ap
          assert 'versionName = "1.0.4"' in az
          assert 'CODE=141' in Path(".github/workflows/android-pasr.yml").read_text()
          assert 'export VERSION_CODE=134' in Path(".github/workflows/android-zakelijk.yml").read_text()
          print("App versions validated.")
          PY
      - name: Check generated Xcode project is in sync
        run: |
          python3 zakelijk/apple/make_project.py
          git diff --exit-code -- zakelijk/apple/PasrZakelijk.xcodeproj/project.pbxproj \
            zakelijk/apple/PasrZakelijk.xcodeproj/xcshareddata/xcschemes/PasrZakelijk.xcscheme \
            zakelijk/apple/PasrZakelijk.xcodeproj/xcshareddata/xcschemes/PasrZakelijkMac.xcscheme

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pasr_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pasr_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Test campaign, retention and community transactions on isolated Postgres
        env:
          PGPASSWORD: pasr_test_password
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          fi
          for file in \
            supabase/tests/loyalty_fixture.sql \
            supabase/loyalty-campaign.sql \
            supabase/loyalty-retention.sql \
            supabase/loyalty-community.sql \
            supabase/20261127-community-invites.sql \
            supabase/loyalty-vip.sql \
            supabase/20261124-promo-codes.sql \
            supabase/20261124-app-only-discount-management.sql \
            supabase/20261124-deletion.sql \
            supabase/20261127-tickets-klantenkaart.sql \
            supabase/20261127-antibot-forms.sql \
            supabase/20261128-beheer-mail.sql \
            supabase/20261128-business-delete.sql \
            supabase/tests/loyalty_smoke.sql \
            supabase/tests/promo_smoke.sql \
            supabase/tests/community_invites_smoke.sql \
            supabase/tests/tickets_klantenkaart_smoke.sql \
            supabase/tests/antibot_forms_smoke.sql \
            supabase/tests/beheer_mail_smoke.sql \
            supabase/tests/business_delete_smoke.sql \
            supabase/20261127-tickets-klantenkaart.sql \
            supabase/20261127-antibot-forms.sql \
            supabase/tests/antibot_forms_smoke.sql \
            supabase/20261128-beheer-mail.sql \
            supabase/tests/beheer_mail_smoke.sql; do
            echo "::group::SQL $file"
            psql -h localhost -U postgres -d pasr_test -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Mails and push of the Supabase functions (same tests as the Backend workflow)
        run: |
          python3 supabase/templates/build.py
          git diff --exit-code -- supabase/functions/*/template.ts supabase/templates/
          deno test --no-check --allow-env supabase/functions/admin/ supabase/functions/community-mail/ \
            supabase/functions/reminder-mail/ supabase/functions/group-invite/ supabase/functions/event-mail/
          deno test --no-check --allow-env --allow-net=127.0.0.1 supabase/functions/mail/
          deno test --no-check -A supabase/functions/wallet-pass/ supabase/functions/google-wallet/

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every reference to pasr_businesses is cascade or set null (business delete)
        run: python3 supabase/tests/business_delete_fk_check.py
      - name: Parse every new PostgreSQL migration
        run: |
          python3 -m venv /tmp/pasr-sql
          /tmp/pasr-sql/bin/pip install -q 'pglast>=7,<10'
          /tmp/pasr-sql/bin/python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          for name in ('loyalty-community.sql','loyalty-retention.sql','loyalty-campaign.sql','loyalty-vip.sql','20261124-promo-codes.sql','20261124-app-only-discount-management.sql','20261124-deletion.sql','20261127-community-invites.sql','tests/community_invites_smoke.sql','20261127-tickets-klantenkaart.sql','tests/tickets_klantenkaart_smoke.sql','20261127-antibot-forms.sql','tests/antibot_forms_smoke.sql','20261128-beheer-mail.sql','tests/beheer_mail_smoke.sql','20261128-business-delete.sql','tests/business_delete_smoke.sql'):
              path=Path('supabase')/name
              if path.exists():
                  parse_sql(path.read_text())
                  print('SQL parsed:',name)
          PY
      - name: Parse modified Swift source
        run: |
          if command -v swiftc >/dev/null 2>&1; then
            for f in zakelijk/apple/PasrZakelijk/Views/BusinessMarketingView.swift \
                     zakelijk/apple/PasrZakelijk/Views/BusinessLocationsView.swift \
                     zakelijk/apple/PasrZakelijk/Views/BusinessCommunityView.swift \
                     zakelijk/apple/PasrZakelijk/Views/CommunityInvites.swift \
                     zakelijk/apple/PasrZakelijk/Views/LoyaltyProgramView.swift \
                     zakelijk/apple/PasrZakelijk/Views/OverviewView.swift \
                     App/Views/PasrBenefitsView.swift App/Views/StampViews.swift \
                     App/Views/PasrDiscountCard.swift App/Views/AddToPasrSheet.swift \
                     zakelijk/apple/PasrZakelijk/Views/WebsiteBadgeView.swift \
                     zakelijk/apple/PasrZakelijk/Views/BusinessDiscountCard.swift; do
              swiftc -frontend -parse "$f"
            done
          else
            echo "::warning::Swift compiler not preinstalled on Linux runner"
          fi

  ios-compile:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Pasr.xcodeproj
            scheme: Pasr
          - project: zakelijk/apple/PasrZakelijk.xcodeproj
            scheme: PasrZakelijk
    steps:
      - uses: actions/checkout@v4
      - name: Compile iOS Simulator without signing
        run: |
          xcodebuild -project "${{ matrix.project }}" -scheme "${{ matrix.scheme }}" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

  macos-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Pasr Zakelijk for macOS (native app + widgets) without signing
        run: |
          set -o pipefail
          xcodebuild -project zakelijk/apple/PasrZakelijk.xcodeproj -scheme PasrZakelijkMac \
            -destination 'platform=macOS' -configuration Debug CODE_SIGNING_ALLOWED=NO build \
            | tee /tmp/mac-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" /tmp/mac-build.log
      - name: Check the Mac app bundle (widgets embedded, same version and bundle id as iOS)
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Build/Products/Debug/Pasr Zakelijk.app" -maxdepth 6 | head -1)
          test -n "$APP"
          PL="$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PL")" = "app.lrvdlinden.pasrzakelijk"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PL")" = "1.0.4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL")" = "21"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PL" > /dev/null
          test -d "$APP/Contents/PlugIns/PasrZakelijkMacWidgets.appex"
          ls "$APP/Contents/Resources" | grep -E "PrivacyInfo|lproj" || true

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pasr, zakelijk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check generated English strings for Zakelijk
        if: matrix.app == 'zakelijk'
        run: |
          (cd android/zakelijk && python3 tools/make_strings.py)
          git diff --exit-code -- android/zakelijk/app/src/main/java/app/lrvdlinden/pasrzakelijk/core/EnStrings.kt
      - name: Compile debug APK (no signing secrets)
        working-directory: android/${{ matrix.app }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
