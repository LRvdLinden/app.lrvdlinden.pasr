name: Xcode projecten als ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xcode-source-zips.yml"
      - "zakelijk/apple/make_project.py"
      - "zakelijk/apple/PasrZakelijk.xcodeproj/project.pbxproj"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-zips:
    name: Complete Xcode project-ZIPs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bouw twee zelfstandige Xcode-bronproject-ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          work="$(mktemp -d)"
          mkdir -p "$work/Pasr-Klantenkaarten-1.0.5" "$work/Pasr-Zakelijk-1.0.3"
          cp -a App Shared Watch Widgets Config Pasr.xcodeproj "$work/Pasr-Klantenkaarten-1.0.5/"
          cat > "$work/Pasr-Klantenkaarten-1.0.5/OPEN-IN-XCODE.md" <<'INFO'
          # Pasr: Klantenkaarten 1.0.5
          Open `Pasr.xcodeproj` in Xcode op een Mac.
          Selecteer scheme `Pasr`, kies 'Any iOS Device (arm64)',
          configureer je eigen Apple Developer Team en signing.
          Ga naar Product > Archive en daarna Organizer > Distribute App > App Store Connect.
          Het project bevat iPhone/iPad, Watch, Widgets, Swift-broncode en assets.
          INFO
          cp -a zakelijk/apple/. "$work/Pasr-Zakelijk-1.0.3/"
          cat > "$work/Pasr-Zakelijk-1.0.3/OPEN-IN-XCODE.md" <<'INFO'
          # Pasr Zakelijk 1.0.3
          Open `PasrZakelijk.xcodeproj` in Xcode op een Mac.
          Selecteer scheme `PasrZakelijk`, kies 'Any iOS Device (arm64)',
          configureer je Apple Developer Team en signing.
          Ga naar Product > Archive en daarna Organizer > Distribute App > App Store Connect.
          Inclusief Swift-broncode, assets, entitlements en make_project.py.
          INFO
          test -f "$work/Pasr-Klantenkaarten-1.0.5/Pasr.xcodeproj/project.pbxproj"
          test -f "$work/Pasr-Zakelijk-1.0.3/PasrZakelijk.xcodeproj/project.pbxproj"
          (cd "$work" && zip -qr "$GITHUB_WORKSPACE/dist/Pasr-Klantenkaarten-Xcode-1.0.5.zip" Pasr-Klantenkaarten-1.0.5)
          (cd "$work" && zip -qr "$GITHUB_WORKSPACE/dist/Pasr-Zakelijk-Xcode-1.0.3.zip" Pasr-Zakelijk-1.0.3)
          unzip -tq dist/Pasr-Klantenkaarten-Xcode-1.0.5.zip
          unzip -tq dist/Pasr-Zakelijk-Xcode-1.0.3.zip
          ls -lh dist/*.zip

      - name: Xcode-projecten als downloadbare artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pasr-Xcode-Projecten-1.0.5-en-1.0.3
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Rechtstreekse ZIP downloads als GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="xcode-pasr-1.0.5-61-zakelijk-1.0.3-17"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Xcode projecten: Pasr 1.0.5 + Zakelijk 1.0.3" --notes "Twee volledige Xcode-bronprojecten om lokaal met Xcode te archiveren en naar App Store Connect te uploaden. Apple signing en archive gebeuren lokaal." --latest=false
          fi
          gh release upload "$TAG" dist/Pasr-Klantenkaarten-Xcode-1.0.5.zip dist/Pasr-Zakelijk-Xcode-1.0.3.zip --clobber
