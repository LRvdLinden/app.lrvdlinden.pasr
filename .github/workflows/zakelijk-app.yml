name: Zakelijk-app

# Checks that the app Pasr Zakelijk (zakelijk/apple) builds for iPhone/iPad (simulator), without signing.
# Runs on every push that changes zakelijk/, or by hand.
on:
  push:
    branches: [main, gedeelde-pasr]
    paths: ["zakelijk/**", ".github/workflows/zakelijk-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zakelijk-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: zakelijk/apple
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild build -project PasrZakelijk.xcodeproj -scheme PasrZakelijk -configuration Debug \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee /tmp/build.log | grep -E "error:|warning: .*(deprecated|will never)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" /tmp/build.log
      - name: Check Info.plist
        working-directory: zakelijk/apple
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/PasrZakelijk.app" -maxdepth 6 | head -1)
          for key in CFBundleDisplayName CFBundleShortVersionString CFBundleVersion NSCameraUsageDescription ITSAppUsesNonExemptEncryption CFBundleURLTypes; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$APP/Info.plist" > /dev/null || { echo "missing $key"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$APP/Info.plist"
          ls "$APP" | grep -E "PrivacyInfo|lproj" || true
