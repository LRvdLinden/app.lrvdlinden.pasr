name: Beheer

# Publishes Pasr Beheer (beheer/web) to https://beheer.pasr.nl via FTPS (certificate checked), on every push that
# changes beheer/web, or by hand (Actions › Beheer › Run workflow).
# Secrets: BEHEER_FTP_USER + BEHEER_FTP_PASSWORD (an FTP account that lands in the folder of beheer.pasr.nl), or the
# website's FTP_* secrets plus BEHEER_FTP_DIR (the folder of beheer.pasr.nl as seen from that FTP login).
# Safety: if the target folder already holds a site that is not Pasr, nothing is uploaded.
on:
  push:
    branches: [main]
    paths: ["beheer/web/**", ".github/workflows/beheer.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beheer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase settings for the dashboard
        env:
          A_URL: ${{ secrets.PASR_SUPABASE_URL }}
          A_KEY: ${{ secrets.PASR_SUPABASE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          url, key = (os.environ.get("A_URL") or "").strip().rstrip("/"), (os.environ.get("A_KEY") or "").strip()
          if url and key:
              open("beheer/web/config.js", "w").write(
                  "// Written by the Beheer workflow (public values).\nwindow.BEHEER = " + json.dumps({"url": url, "key": key}) + ";\n")
          print("Config:", "set" if url and key else "kept (secrets PASR_SUPABASE_URL / PASR_SUPABASE_KEY missing)")
          PY
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload via FTPS
        id: upload
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BEHEER_FTP_USER || secrets.FTP_USER || secrets.FTP_USERNAME }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PASSWORD: ${{ secrets.BEHEER_FTP_USER && secrets.BEHEER_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.BEHEER_FTP_USER && secrets.BEHEER_FTP_DIR || secrets.BEHEER_FTP_DIR }}
          OWN_ACCOUNT: ${{ secrets.BEHEER_FTP_USER != '' }}
        run: |
          set -euo pipefail
          note(){ echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; echo "$1" >> /tmp/report.txt; }
          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            note "FTP secrets missing (FTP_SERVER, FTP_USER, FTP_PASSWORD) — dashboard not uploaded."
            exit 1
          fi
          trim(){ printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          FTP_SERVER=$(trim "$FTP_SERVER" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          FTP_USERNAME=$(trim "$FTP_USERNAME"); FTP_DIR=$(trim "${FTP_DIR:-}")
          PORT=$(trim "${FTP_PORT:-}" | tr -cd '0-9'); PORT="${PORT:-21}"
          export LFTP_PASSWORD=$(trim "$FTP_PASSWORD")
          CA=/tmp/ftp-ca.pem; cp /etc/ssl/certs/ca-certificates.crt "$CA"
          if [ "$PORT" = "22" ]; then
            # SFTP (SSH): encrypted; the server key is recorded on first use
            mkdir -p ~/.ssh; ssh-keyscan -p 22 -T 20 "$FTP_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
            common="set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set dns:order inet; set sftp:auto-confirm no"
            HOST="sftp://$FTP_SERVER"
            note "Connecting with SFTP (port 22)."
          else
            common="set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set dns:order inet; set ftp:passive-mode true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; set ssl:check-hostname yes; set ssl:ca-file $CA"
            ip_of(){ (getent ahostsv4 "$1" || true) | awk 'NR==1{print $1}'; }
            if [ "$PORT" = "990" ]; then tls="-connect"; else tls="-starttls ftp -connect"; fi
            sc(){ timeout 40 openssl s_client ${tls/-connect/} -connect "$1:$PORT" -servername "$1" "${@:2}" </dev/null 2>/dev/null; }
            add_chain(){
              local aia
              aia=$(sc "$1" | openssl x509 -noout -text 2>/dev/null | grep -oE 'CA Issuers - URI:[^ ]+' | sed 's/CA Issuers - URI://' | head -1 || true)
              [ -n "$aia" ] || return 0
              curl -fsSL --max-time 20 "$aia" -o /tmp/inter.bin 2>/dev/null || return 0
              openssl x509 -inform DER -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || openssl x509 -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || return 0
              cat /tmp/inter.pem >> "$CA"
            }
            cert_ok(){ sc "$1" -verify_hostname "$1" -verify_return_error -CAfile "$CA" | grep -q 'Verify return code: 0 (ok)'; }
            HOST=""
            base_ip=$(ip_of "$FTP_SERVER")
            [ -n "$base_ip" ] || { note "FTP_SERVER does not resolve."; exit 1; }
            add_chain "$FTP_SERVER"
            if cert_ok "$FTP_SERVER"; then HOST="$FTP_SERVER"; else
              names=$(sc "$FTP_SERVER" | openssl x509 -noout -ext subjectAltName -subject 2>/dev/null \
                | grep -oE '(DNS:|CN ?= ?)(\*\.)?[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' | sed -E 's/^(DNS:|CN ?= ?)//' | sort -u || true)
              ptr=$(getent hosts "$base_ip" 2>/dev/null | awk '{print $2}' | sed 's/\.$//' || true)
              cands="$ptr"; first="${FTP_SERVER%%.*}"
              for n in $names; do case "$n" in \*.*) cands="$cands $first.${n#\*.} ftp.${n#\*.}";; *) cands="$cands $n";; esac; done
              for n in $(echo $cands | tr ' ' '\n' | sort -u); do
                [ "$(ip_of "$n")" = "$base_ip" ] || continue
                if cert_ok "$n"; then HOST="$n"; break; fi
              done
            fi
            [ -n "$HOST" ] || { note "No valid FTPS certificate found for FTP_SERVER on port $PORT. The server's certificate is for: $(echo $names | tr '\n' ' ')${ptr:+ (reverse DNS: $ptr)}. Set the secret FTP_SERVER to one of those names (the one your hosting gives for FTP)."; exit 1; }
            [ "$PORT" = "990" ] && HOST="ftps://$HOST"
          fi
          run(){ lftp -e "$common; open -p $PORT --env-password -u \"$FTP_USERNAME\" \"$HOST\"; $1; bye"; }
          ok=""
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && sleep 30
            if run "cls -1 > /tmp/root.txt" 2>/tmp/err.txt; then ok=1; break; fi
            echo "Login attempt $attempt failed: $(grep -viE 'user|pass' /tmp/err.txt | tr '\n' ' ' | tail -c 200)"
          done
          if [ -z "$ok" ]; then
            msg=$(grep -viE 'user|pass|@' /tmp/err.txt | tr '\n' ' ' | sed "s/$FTP_USERNAME/***/g" | tail -c 300 || true)
            note "Login to the FTP server failed (host checked: $([ "$HOST" = "$FTP_SERVER" ] && echo FTP_SERVER || echo "$HOST"), port $PORT). Server said: ${msg:-no message}"
            exit 1
          fi
          # target folder: BEHEER_FTP_DIR, else (own FTP account of the subdomain) the login folder
          TARGET="$FTP_DIR"
          if [ -z "$TARGET" ]; then
            if [ "$OWN_ACCOUNT" != "true" ]; then
              note "Set BEHEER_FTP_DIR (the folder of beheer.pasr.nl), or BEHEER_FTP_USER/BEHEER_FTP_PASSWORD for an FTP account of that folder. Nothing uploaded."
              exit 1
            fi
            TARGET="."
          fi
          # safety: never overwrite another website
          rm -f /tmp/remote-index.html
          run "get \"$TARGET/index.html\" -o /tmp/remote-index.html" >/dev/null 2>&1 || true
          if [ -s /tmp/remote-index.html ] && ! grep -qi "pasr" /tmp/remote-index.html; then
            note "Stopped: the target folder already has another website (no Pasr in index.html). Check BEHEER_FTP_DIR."
            exit 1
          fi
          run "mirror -R --verbose --parallel=4 --only-newer --exclude-glob .DS_Store beheer/web/ \"$TARGET\""
          run "put beheer/web/.htaccess -o \"$TARGET/.htaccess\""
          code=$(curl -s -o /dev/null -w '%{http_code}' https://beheer.pasr.nl/ || true)
          note "Dashboard uploaded (port $PORT, certificate checked). https://beheer.pasr.nl answers HTTP ${code:-?}."
      - name: Report on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### Beheer: ${{ steps.upload.outcome }}"; cat /tmp/report.txt 2>/dev/null || true; } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null
