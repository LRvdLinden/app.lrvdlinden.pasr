name: Beheer

# Builds beheer.pasr.nl-web.zip (folder web/) from beheer/web as a workflow artifact. Léon uploads beheer.pasr.nl
# himself; this workflow never uploads via FTP (the FTP_* secrets belong to pasr.nl and must never touch beheer).
on:
  push:
    branches: [main]
    paths: ["beheer/web/**", ".github/workflows/beheer.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beheer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase settings for the dashboard
        env:
          A_URL: ${{ secrets.PASR_SUPABASE_URL }}
          A_KEY: ${{ secrets.PASR_SUPABASE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          url, key = (os.environ.get("A_URL") or "").strip().rstrip("/"), (os.environ.get("A_KEY") or "").strip()
          if url and key:
              open("beheer/web/config.js", "w").write(
                  "// Written by the Beheer workflow (public values).\nwindow.BEHEER = " + json.dumps({"url": url, "key": key}) + ";\n")
          print("Config:", "set" if url and key else "kept (secrets PASR_SUPABASE_URL / PASR_SUPABASE_KEY missing)")
          PY
      - name: Zip for manual upload
        id: upload
        run: |
          mkdir -p out/web && cp -r beheer/web/. out/web/
          (cd out && zip -qr ../beheer.pasr.nl-web.zip web)
          echo "beheer.pasr.nl-web.zip gemaakt; Léon uploadt die zelf naar beheer.pasr.nl." | tee /tmp/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: beheer.pasr.nl-web
          path: beheer.pasr.nl-web.zip
      - name: Report on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### Beheer: ${{ steps.upload.outcome }}"; cat /tmp/report.txt 2>/dev/null || true; } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null
