name: Pasr Klantenkaarten 1.0.6 Xcode-project

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Shared/**"
      - "Watch/**"
      - "Widgets/**"
      - "Config/**"
      - "Pasr.xcodeproj/**"
      - ".github/workflows/xcode-pasr.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Maak volledig Xcode-project
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MARKETING_VERSION = "1.0.6"' Pasr.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = "67"' Pasr.xcodeproj/project.pbxproj
          mkdir -p dist
          work="$(mktemp -d)"
          folder="Pasr-Klantenkaarten-1.0.6-build67"
          mkdir -p "$work/$folder"
          cp -a App Shared Watch Widgets Config Pasr.xcodeproj "$work/$folder/"
          printf '%s\n' '# Pasr Klantenkaarten 1.0.6 build 67' 'Open Pasr.xcodeproj in Xcode. Selecteer scheme Pasr, stel signing in en gebruik Product > Archive om via Organizer te distribueren.' > "$work/$folder/OPEN-IN-XCODE.md"
          (cd "$work" && zip -qr "$GITHUB_WORKSPACE/dist/Pasr-Klantenkaarten-Xcode-1.0.6-build67.zip" "$folder")
          unzip -tq dist/Pasr-Klantenkaarten-Xcode-1.0.6-build67.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pasr-Klantenkaarten-Xcode-1.0.6-build67
          path: dist/Pasr-Klantenkaarten-Xcode-1.0.6-build67.zip
          retention-days: 90
      - name: Publiceer ZIP op GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="xcode-pasr-1.0.6-build67"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --latest=false --title "Pasr Klantenkaarten 1.0.6 (build 67) – Xcode" --notes "Gratis tickets en klantenkaarten met barcode van zaken: aanmelden via pasr.nl/add/e/…, tickets als Wallet-eventticket (naast elkaar per event), klantenkaart via pasr.nl/add/m/… met korting en spaarstand, meldingen en Apple Wallet. Het Xcode-project kan lokaal worden gearchiveerd en ingediend bij App Store Connect."
          fi
          gh release upload "$TAG" dist/Pasr-Klantenkaarten-Xcode-1.0.6-build67.zip --clobber
