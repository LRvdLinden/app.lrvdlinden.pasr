# Pasr Zakelijk voor Android: bouwt een ondertekende APK (android/zakelijk) en schermafbeeldingen (Paparazzi).
#
# Ondertekenen: altijd met dezelfde sleutel, zodat elke update over de vorige versie heen installeert. Zelfde opzet als
# Bekendr (LRvdLinden/app.lrvdlinden.bekendr): de sleutel staat versleuteld in android/zakelijk/signing/pasrzakelijk.jks.enc
# en wordt ontgrendeld met een wachtwoord dat uit de bestaande repo-secret PASR_APNS_KEY_P8 wordt afgeleid. Bestaat het
# bestand nog niet, dan maakt de eerste run één keer een nieuwe sleutel (RSA 4096, 100 jaar) en zet hem versleuteld terug
# op deze branch. Het wachtwoord en de sleutel komen nooit in de log of in de repo.
# Let op: wordt PASR_APNS_KEY_P8 ooit vervangen, dan kan deze workflow de sleutel niet meer openen (hij weigert dan; er
# wordt nooit stilletjes een nieuwe sleutel gemaakt). Zet in dat geval eerst de oude waarde terug.
# Optioneel: repository-variabele PASRZAKELIJK_CERT_SHA256 = de vingerafdruk uit de log; dan weigert de workflow elke
# APK die met een andere sleutel is ondertekend.
name: Android Pasr Zakelijk

on:
  push:
    branches: [gedeelde-pasr, main]
    paths: ["android/zakelijk/**", ".github/workflows/android-zakelijk.yml"]
  workflow_dispatch:

concurrency:
  group: android-zakelijk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: APK bouwen en ondertekenen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/zakelijk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Teksten controleren (EnStrings.kt actueel)
        run: |
          python3 tools/make_strings.py
          git diff --exit-code -- app/src/main/java/app/lrvdlinden/pasrzakelijk/core/EnStrings.kt \
            || { echo "::error::EnStrings.kt is niet bijgewerkt. Draai python3 tools/make_strings.py in android/zakelijk."; exit 1; }

      - name: Firebase (google-services.json uit de secret, nooit in de repo)
        env:
          GSJ: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          rm -f app/google-services.json
          if [ -z "$GSJ" ]; then echo "::warning::FIREBASE_GOOGLE_SERVICES_JSON ontbreekt: de APK wordt zonder push gebouwd."; exit 0; fi
          umask 077
          printf '%s' "$GSJ" > "$RUNNER_TEMP/gs.json"
          # alleen gebruiken als Pasr Zakelijk (app.lrvdlinden.pasrzakelijk) als Android-app in het Firebase-project staat
          if python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if any(c.get('client_info',{}).get('android_client_info',{}).get('package_name')=='app.lrvdlinden.pasrzakelijk' for c in d.get('client',[])) else 1)" "$RUNNER_TEMP/gs.json"; then
            cp "$RUNNER_TEMP/gs.json" app/google-services.json
            echo "::notice::Firebase staat aan (push via FCM)."
          else
            echo "::warning::app.lrvdlinden.pasrzakelijk staat niet in google-services.json: voeg Pasr Zakelijk als Android-app toe aan het Firebase-project. Deze APK heeft geen push."
          fi
          rm -f "$RUNNER_TEMP/gs.json"

      - name: Vaste ondertekensleutel
        env:
          SEED: ${{ secrets.PASR_APNS_KEY_P8 }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$SEED" ]; then echo "::error::De secret PASR_APNS_KEY_P8 ontbreekt; zonder die secret kan de vaste sleutel niet worden ontgrendeld."; exit 1; fi
          PASS=$(printf 'pasrzakelijk-android:%s' "$SEED" | sha256sum | cut -c1-40)
          echo "::add-mask::$PASS"
          F=signing/pasrzakelijk.jks.enc
          umask 077
          # Een eerdere run kan de sleutel al op de branch hebben gezet na deze commit: die altijd gebruiken.
          git fetch -q origin "$BRANCH" || true
          if [ ! -f "$F" ] && git cat-file -e "origin/$BRANCH:android/zakelijk/$F" 2>/dev/null; then
            mkdir -p signing; git show "origin/$BRANCH:android/zakelijk/$F" > "$F"
          fi
          if [ ! -f "$F" ]; then
            mkdir -p signing
            keytool -genkeypair -keystore "$RUNNER_TEMP/pz.jks" -storetype PKCS12 -alias pasrzakelijk -keyalg RSA -keysize 4096 \
              -validity 36500 -storepass "$PASS" -keypass "$PASS" -dname "CN=Leon van der Linden, O=LRvdLinden, C=NL" >/dev/null 2>&1
            PASS="$PASS" openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/pz.jks" -out "$F" -pass env:PASS
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$F"
            git commit -q -m "Pasr Zakelijk Android: vaste ondertekensleutel (versleuteld)"
            for i in 1 2 3; do git pull --rebase -q origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && break; sleep 5; done
            echo "::notice::Nieuwe vaste sleutel aangemaakt en versleuteld bewaard in android/zakelijk/$F."
          else
            PASS="$PASS" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$F" -out "$RUNNER_TEMP/pz.jks" -pass env:PASS \
              || { echo "::error::De vaste sleutel kan niet worden ontgrendeld (is PASR_APNS_KEY_P8 gewijzigd?). Er wordt GEEN nieuwe sleutel gemaakt."; exit 1; }
            echo "Vaste sleutel ontgrendeld."
          fi
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/pz.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=pasrzakelijk"
            echo "ANDROID_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: APK bouwen
        env:
          VERSION_CODE: 124
        run: |
          set -o pipefail
          export VERSION_CODE=124
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Fouten als annotaties
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: " build.log | sort -u | head -60 | while IFS= read -r line; do
            path=$(echo "$line" | sed -E 's|^e: file://([^:]+):([0-9]+):.*|\1|'); ln=$(echo "$line" | sed -E 's|^e: file://[^:]+:([0-9]+):.*|\1|')
            msg=$(echo "$line" | sed -E 's|^e: file://[^ ]+ ||')
            echo "::error file=${path#$GITHUB_WORKSPACE/},line=$ln::$msg"
          done
          grep -E "What went wrong|Could not|error:|ERROR:" -A4 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done

      - name: APK manifest controleren (permissions, pakket en versie)
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt"
          "$AAPT" dump permissions "$APK" > /tmp/pasr-permissions.txt
          "$AAPT" dump badging "$APK" > /tmp/pasr-badging.txt
          grep -Fq "package: name='app.lrvdlinden.pasrzakelijk'" /tmp/pasr-badging.txt
          grep -Fq "name='android.permission.CAMERA'" /tmp/pasr-permissions.txt
          grep -Fq "name='android.permission.POST_NOTIFICATIONS'" /tmp/pasr-permissions.txt
          echo "APK manifest gevalideerd: app.lrvdlinden.pasrzakelijk (camera, meldingen)."

      - name: Handtekening controleren
        id: verify
        env:
          EXPECTED: ${{ vars.PASRZAKELIJK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$SIGNER" verify --print-certs "$APK" > certs.txt
          FP="$(grep -m1 'SHA-256 digest' certs.txt | sed 's/.*: //' | tr 'a-f' 'A-F')"
          rm -f certs.txt
          echo "::notice::Pasr Zakelijk ondertekend met certificaat SHA-256 $FP"
          if [ -n "$EXPECTED" ]; then
            WANT="$(printf '%s' "$EXPECTED" | tr -d ': ' | tr 'a-f' 'A-F')"
            if [ "$FP" != "$WANT" ]; then
              echo "::error::Deze APK is met een ANDERE sleutel ondertekend dan PASRZAKELIJK_CERT_SHA256. Hij zou niet over de vorige versie installeren."
              exit 1
            fi
          fi
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p dist
          cp "$APK" dist/pasr-zakelijk.apk
          cp "$APK" "dist/PasrZakelijk-$V.apk"
          ( cd dist && sha256sum pasr-zakelijk.apk > pasr-zakelijk.apk.sha256 )
          echo "$FP" > dist/certificaat-sha256.txt
          # gegevens voor pasr.nl/android/ (de workflow Website zet dit naast de APK als /download/pasr-zakelijk.json)
          printf '{"app":"pasr-zakelijk","version":"%s","code":%s,"size":%s,"sha256":"%s","date":"%s","cert_sha256":"%s"}\n' \
            "$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')" "124" \
            "$(stat -c %s dist/pasr-zakelijk.apk)" "$(sha256sum dist/pasr-zakelijk.apk | cut -d' ' -f1)" "$(date -u +%Y-%m-%d)" "$FP" > dist/pasr-zakelijk.json
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=124" >> "$GITHUB_OUTPUT"
          echo "cert=$FP" >> "$GITHUB_OUTPUT"
          echo "APK $V (124), $(stat -c %s dist/pasr-zakelijk.apk) bytes, sha256 $(cut -d' ' -f1 dist/pasr-zakelijk.apk.sha256)"

      - name: Nieuwste APK naar de branch android-builds (zakelijk/), voor de website en de oplevering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/builds"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4; do
            rm -rf "$W"; mkdir -p "$W"; cd "$W"
            if git clone -q --depth 1 --branch android-builds "$URL" . 2>/dev/null; then :; else
              git init -q; git checkout -q --orphan android-builds; git remote add origin "$URL"
              printf 'Nieuwste Android-builds (APK, versie-info en previews), gemaakt door de Android-workflows. Niet mergen.\n' > README.md
            fi
            rm -rf zakelijk && mkdir -p zakelijk
            cp "$GITHUB_WORKSPACE/android/zakelijk/dist/pasr-zakelijk.apk" "$GITHUB_WORKSPACE/android/zakelijk/dist/pasr-zakelijk.json" \
               "$GITHUB_WORKSPACE"/android/zakelijk/dist/PasrZakelijk-*.apk "$GITHUB_WORKSPACE/android/zakelijk/dist/certificaat-sha256.txt" zakelijk/
            git add -A && git commit -q -m "Android-build zakelijk (${GITHUB_SHA::7})" || { echo "Niets nieuw"; exit 0; }
            git push -q origin HEAD:android-builds && exit 0
            cd "$GITHUB_WORKSPACE"; sleep 5
          done
          echo "::warning::Kon de branch android-builds niet bijwerken"

      - name: Sleutel en Firebase-bestand opruimen
        if: always()
        run: rm -f "$RUNNER_TEMP/pz.jks" app/google-services.json

      - uses: actions/upload-artifact@v4
        with:
          name: PasrZakelijk-Android
          path: |
            android/zakelijk/dist/pasr-zakelijk.apk
            android/zakelijk/dist/PasrZakelijk-*.apk
            android/zakelijk/dist/pasr-zakelijk.apk.sha256
            android/zakelijk/dist/certificaat-sha256.txt
            android/zakelijk/dist/pasr-zakelijk.json

      - name: Release (nieuwste APK voor pasr.nl/download/pasr-zakelijk.apk)
        # Zelfde opzet als android-pasr.yml: de workflow Website haalt pasr-zakelijk.apk en .json uit de nieuwste
        # release android-zakelijk-*; lukt de release niet, dan pakt hij het artifact PasrZakelijk-Android.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-zakelijk-${{ steps.verify.outputs.version }}-${{ steps.verify.outputs.code }}
          target_commitish: ${{ github.sha }}
          name: Pasr Zakelijk voor Android ${{ steps.verify.outputs.version }} (${{ steps.verify.outputs.code }})
          make_latest: false
          body: |
            Pasr Zakelijk voor Android. Installeer `pasr-zakelijk.apk`; een update installeert over de vorige versie heen (altijd dezelfde sleutel).
            Certificaat SHA-256: ${{ steps.verify.outputs.cert }}
            Download: https://pasr.nl/android/#zakelijk
          files: |
            android/zakelijk/dist/pasr-zakelijk.apk
            android/zakelijk/dist/pasr-zakelijk.json
            android/zakelijk/dist/PasrZakelijk-${{ steps.verify.outputs.version }}.apk

  previews:
    name: Schermafbeeldingen (Paparazzi)
    needs: apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/zakelijk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Opnemen
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:recordPaparazziDebug 2>&1 | tee preview.log
      - name: Fouten tonen
        if: failure()
        run: |
          grep -E "^e: |FAILED|Exception|What went wrong" -A3 preview.log | head -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PasrZakelijk-Android-previews
          path: android/zakelijk/app/src/test/snapshots/images/*.png
          if-no-files-found: warn
      - name: Schermafbeeldingen bij de release zetten
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls app/src/test/snapshots/images/*.png >/dev/null 2>&1 || exit 0
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          (cd app/src/test/snapshots/images && zip -q -r "$RUNNER_TEMP/PasrZakelijk-Android-previews.zip" .)
          gh release upload "android-zakelijk-$V-124" "$RUNNER_TEMP/PasrZakelijk-Android-previews.zip" --clobber -R "${{ github.repository }}"
      - name: Schermafbeeldingen naar de branch android-builds (zakelijk-previews/)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/builds"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4; do
            rm -rf "$W"; mkdir -p "$W"; cd "$W"
            git clone -q --depth 1 --branch android-builds "$URL" . || { cd "$GITHUB_WORKSPACE"; sleep 5; continue; }
            rm -rf zakelijk-previews && mkdir -p zakelijk-previews
            cp "$GITHUB_WORKSPACE"/android/zakelijk/app/src/test/snapshots/images/*.png zakelijk-previews/
            git add -A && git commit -q -m "Android-previews zakelijk (${GITHUB_SHA::7})" || { echo "Niets nieuw"; exit 0; }
            git push -q origin HEAD:android-builds && exit 0
            cd "$GITHUB_WORKSPACE"; sleep 5
          done
          echo "::warning::Kon de previews niet in android-builds zetten"
