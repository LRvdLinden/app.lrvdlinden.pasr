name: Backend

# Sets up the Pasr account backend on Supabase: database schema (supabase/schema.sql), the branded account mails,
# the honeypot/anti-bot hook and the Auth settings. Runs on every push that changes supabase/, or by hand.
#
# Repository secrets:
#   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com › Account › Access Tokens)
#   SUPABASE_PROJECT_REF    the project ref (the "abcd1234" in https://abcd1234.supabase.co)
# Optional, for mails from your own address (without them Supabase only mails a few messages per hour):
#   PASR_SMTP_HOST, PASR_SMTP_PORT, PASR_SMTP_USER, PASR_SMTP_PASSWORD, PASR_SMTP_FROM (e.g. noreply@pasr.nl)
# For "Add to Apple Wallet" (function wallet-pass, signs the passes):
#   PASS_CERT_P12 (the Pass Type ID certificate + key as .p12, base64), PASS_CERT_PASSWORD,
#   PASS_TYPE_ID (default pass.nl.lrvdlinden.pasr), PASR_SUPABASE_KEY (the publishable key)
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF || 'xcfuiszcfgkpbixqzrjb' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF missing: backend not set up."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Database schema
        if: steps.check.outputs.skip != '1'
        run: |
          python3 -c 'import json;print(json.dumps({"query":open("supabase/schema.sql").read()}))' > /tmp/q.json
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          head -c 600 /tmp/r.txt; echo
          [ "$code" -lt 300 ] || { echo "::error::Schema failed (HTTP $code)"; exit 1; }
      - name: Mails, anti-bot hook and Auth settings
        if: steps.check.outputs.skip != '1'
        env:
          S_HOST: ${{ secrets.PASR_SMTP_HOST }}
          S_PORT: ${{ secrets.PASR_SMTP_PORT }}
          S_USER: ${{ secrets.PASR_SMTP_USER }}
          S_PASS: ${{ secrets.PASR_SMTP_PASSWORD }}
          S_FROM: ${{ secrets.PASR_SMTP_FROM }}
        run: |
          python3 supabase/templates/build.py
          python3 - <<'PY'
          import json, os, urllib.request
          ref, token = os.environ["REF"], os.environ["SUPABASE_ACCESS_TOKEN"]
          api = f"https://api.supabase.com/v1/projects/{ref}/config/auth"
          def call(method, body=None):
              req = urllib.request.Request(api, method=method, data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read() or b"{}")
          cur = call("GET")
          cfg = json.load(open("supabase/templates/templates.json"))
          cfg.update({
              "site_url": "https://pasr.nl",
              "mailer_autoconfirm": False,            # e-mail bevestigen verplicht
              "password_min_length": 8,
              "mailer_otp_exp": 3600,
              "hook_before_user_created_enabled": True,
              "hook_before_user_created_uri": "pg-functions://postgres/public/pasr_before_user_created",
          })
          have = [u.strip() for u in (cur.get("uri_allow_list") or "").split(",") if u.strip()]
          need = [u for u in ("https://pasr.nl/bevestigen/", "https://pasr.nl/account/", "pasr://account") if u not in have]
          if need:
              cfg["uri_allow_list"] = ",".join(have + need)
          # strengere bestaande limieten blijven staan
          for key, value in (("rate_limit_otp", 10), ("rate_limit_verify", 20)):
              if not isinstance(cur.get(key), int) or cur[key] > value:
                  cfg[key] = value
          if all(os.environ.get(k) for k in ("S_HOST", "S_USER", "S_PASS", "S_FROM")):
              cfg.update({"smtp_host": os.environ["S_HOST"], "smtp_port": str(os.environ.get("S_PORT") or "465"),
                          "smtp_user": os.environ["S_USER"], "smtp_pass": os.environ["S_PASS"],
                          "smtp_admin_email": os.environ["S_FROM"], "smtp_sender_name": "Pasr",
                          "rate_limit_email_sent": 30})
              print("::notice::Mails go out via your own SMTP server as " + os.environ["S_FROM"])
          else:
              print("::warning::No PASR_SMTP_* secrets: Supabase sends the mails itself (only a few per hour). Add them for real use.")
          try:
              call("PATCH", cfg)
          except urllib.error.HTTPError as e:
              print("::error::Auth settings failed: HTTP", e.code, e.read()[:400].decode(errors="replace"))
              raise SystemExit(1)
          print("::notice::Branded mails, honeypot hook and Auth settings are set (links go to pasr.nl/bevestigen/).")
          PY
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != '1'
        with:
          version: latest
      - name: Apple Wallet function (wallet-pass)
        if: steps.check.outputs.skip != '1'
        env:
          P12: ${{ secrets.PASS_CERT_P12 }}
          PW: ${{ secrets.PASS_CERT_PASSWORD }}
          PTID: ${{ secrets.PASS_TYPE_ID }}
          PK: ${{ secrets.PASR_SUPABASE_KEY }}
        run: |
          supabase functions deploy wallet-pass --project-ref "$REF" --no-verify-jwt --use-api
          if [ -n "$P12" ]; then
            supabase secrets set --project-ref "$REF" \
              PASS_CERT_P12="$P12" PASS_CERT_PASSWORD="$PW" PASS_TYPE_ID="${PTID:-pass.nl.lrvdlinden.pasr}" \
              PASS_TEAM_ID=EU3UY476T6 PASR_PUBLISHABLE_KEY="$PK" >/dev/null
            echo "::notice::Wallet function deployed and certificate set."
          else
            echo "::warning::PASS_CERT_P12 missing: the Wallet function is deployed but can't sign passes yet."
          fi
      - name: Beheer function (admin)
        if: steps.check.outputs.skip != '1'
        env:
          A_USER: ${{ secrets.PASR_ADMIN_USER }}
          A_PASS: ${{ secrets.PASR_ADMIN_PASSWORD }}
          APNS_P8: ${{ secrets.PASR_APNS_KEY_P8 }}
          APNS_ID: ${{ secrets.PASR_APNS_KEY_ID }}
        run: |
          set -euo pipefail
          deno_ok=1
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || deno_ok=0
          if [ "$deno_ok" = 1 ]; then
            ~/.deno/bin/deno test --no-check supabase/functions/admin/ || { echo "::error::Tests of the admin function failed"; exit 1; }
          fi
          supabase functions deploy admin --project-ref "$REF" --no-verify-jwt --use-api
          # Where the database reaches the function (push notifications via pg_net)
          python3 -c 'import json,os;print(json.dumps({"query":"update public.pasr_admin_config set admin_url = '"'"'https://%s.supabase.co/functions/v1/admin'"'"' where id = 1" % os.environ["REF"]}))' > /tmp/u.json
          curl -sf -o /dev/null -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/u.json
          args=()
          # Token secret: made once, never in GitHub
          if ! supabase secrets list --project-ref "$REF" 2>/dev/null | grep -q PASR_TOKEN_SECRET; then
            args+=("PASR_TOKEN_SECRET=$(openssl rand -hex 32)")
          fi
          if [ -n "$A_USER" ] && [ -n "$A_PASS" ]; then
            [ ${#A_PASS} -ge 12 ] || { echo "::error::PASR_ADMIN_PASSWORD must be at least 12 characters"; exit 1; }
            args+=("PASR_ADMIN_USER=$A_USER" "PASR_ADMIN_PASSWORD=$A_PASS")
          else
            echo "::warning::PASR_ADMIN_USER / PASR_ADMIN_PASSWORD missing: you can't log in to Pasr Beheer yet."
          fi
          if [ -n "$APNS_P8" ] && [ -n "$APNS_ID" ]; then
            args+=("APNS_KEY_P8=$APNS_P8" "APNS_KEY_ID=$APNS_ID" "APNS_TEAM_ID=EU3UY476T6")
          else
            echo "::warning::PASR_APNS_KEY_P8 / PASR_APNS_KEY_ID missing: no push notifications for Pasr Beheer yet."
          fi
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$REF" "${args[@]}" >/dev/null; fi
          echo "::notice::Admin function deployed."
