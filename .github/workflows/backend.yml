name: Backend

# Sets up the Pasr account backend on Supabase: database schema (supabase/schema.sql), the branded account mails,
# the honeypot/anti-bot hook and the Auth settings. Runs on every push that changes supabase/, or by hand.
#
# Repository secrets:
#   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com › Account › Access Tokens)
#   SUPABASE_PROJECT_REF    the project ref (the "abcd1234" in https://abcd1234.supabase.co)
# Optional, for mails from your own address (without them Supabase only mails a few messages per hour):
#   PASR_SMTP_HOST, PASR_SMTP_PORT, PASR_SMTP_USER, PASR_SMTP_PASSWORD, PASR_SMTP_FROM (e.g. noreply@pasr.nl)
# For "Add to Apple Wallet" (function wallet-pass, signs the passes):
#   PASS_CERT_P12 (the Pass Type ID certificate + key as .p12, base64), PASS_CERT_PASSWORD,
#   PASS_TYPE_ID (default pass.nl.lrvdlinden.pasr), PASR_SUPABASE_KEY (the publishable key)
# For push to Android (FCM HTTP v1, function admin): FIREBASE_SERVICE_ACCOUNT_JSON (service account JSON of the Firebase project).
# For "Opslaan in Google Wallet" (function google-wallet, Pasr for Android):
#   GOOGLE_WALLET_ISSUER_ID (issuer id from the Google Pay & Wallet Console),
#   GOOGLE_WALLET_SA_JSON (the service account's JSON key, as text or base64). Missing = the app hides the button.
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF || 'xcfuiszcfgkpbixqzrjb' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF missing: backend not set up."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Database schema
        if: steps.check.outputs.skip != '1'
        run: |
          python3 -c 'import json;print(json.dumps({"query":open("supabase/schema.sql").read() + "\n" + open("supabase/20261124-deletion.sql").read()}))' > /tmp/q.json
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          head -c 600 /tmp/r.txt; echo
          [ "$code" -lt 300 ] || { echo "::error::Schema failed (HTTP $code)"; exit 1; }
      - name: Tijdelijke stempelacties (veilige multipliertechniek)
        if: steps.check.outputs.skip != '1'
        run: |
          set -euo pipefail
          python3 -c 'import json;print(json.dumps({"query":open("supabase/loyalty-campaign.sql").read()}))' > /tmp/campaign.json
          code=$(curl -s -o /tmp/campaign-result.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/campaign.json)
          head -c 500 /tmp/campaign-result.txt; echo
          [ "$code" -lt 300 ] || { echo "::error::Campaign engine failed HTTP $code"; exit 1; }
      - name: VIP-voordelen per niveau
        if: steps.check.outputs.skip != '1'
        run: |
          set -euo pipefail
          python3 -c 'import json;print(json.dumps({"query":open("supabase/loyalty-vip.sql").read()}))' > /tmp/vip.json
          code=$(curl -s -o /tmp/vip-result.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/vip.json)
          head -c 500 /tmp/vip-result.txt; echo
          [ "$code" -lt 300 ] || { echo "::error::VIP rewards schema failed HTTP $code"; exit 1; }
      - name: Toestemming en automatische terugkomherinneringen
        if: steps.check.outputs.skip != '1'
        run: |
          set -euo pipefail
          python3 -c 'import json;print(json.dumps({"query":open("supabase/loyalty-retention.sql").read()}))' > /tmp/retention.json
          code=$(curl -s -o /tmp/retention-result.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/retention.json)
          head -c 500 /tmp/retention-result.txt; echo
          [ "$code" -lt 300 ] || { echo "::error::Retention backend schema failed HTTP $code"; exit 1; }
      - name: Gezamenlijke ondernemersacties (privacy-safe backend)
        if: steps.check.outputs.skip != '1'
        run: |
          set -euo pipefail
          python3 -c 'import json;print(json.dumps({"query":open("supabase/loyalty-community.sql").read()}))' > /tmp/community.json
          code=$(curl -s -o /tmp/community-result.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/community.json)
          head -c 500 /tmp/community-result.txt; echo
          [ "$code" -lt 300 ] || { echo "::error::Community backend schema failed HTTP $code"; exit 1; }
          python3 -c 'import json;print(json.dumps({"query":open("supabase/20261127-admin-offers.sql").read()}))' > /tmp/offers.json
          code=$(curl -s -o /tmp/offers-result.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/offers.json)
          head -c 500 /tmp/offers-result.txt; echo
          [ "$code" -lt 300 ] || { echo "::error::Beheer-acties schema failed HTTP $code"; exit 1; }
      - name: Mails, anti-bot hook and Auth settings
        if: steps.check.outputs.skip != '1'
        env:
          S_HOST: ${{ secrets.PASR_SMTP_HOST }}
          S_PORT: ${{ secrets.PASR_SMTP_PORT }}
          S_USER: ${{ secrets.PASR_SMTP_USER }}
          S_PASS: ${{ secrets.PASR_SMTP_PASSWORD }}
          S_FROM: ${{ secrets.PASR_SMTP_FROM }}
        run: |
          python3 supabase/templates/build.py
          python3 - <<'PY'
          import json, os, urllib.request
          ref, token = os.environ["REF"], os.environ["SUPABASE_ACCESS_TOKEN"]
          api = f"https://api.supabase.com/v1/projects/{ref}/config/auth"
          def call(method, body=None):
              req = urllib.request.Request(api, method=method, data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read() or b"{}")
          cur = call("GET")
          cfg = json.load(open("supabase/templates/templates.json"))
          cfg.update({
              "site_url": "https://pasr.nl",
              "mailer_autoconfirm": False,            # e-mail bevestigen verplicht
              "password_min_length": 8,
              "mailer_otp_exp": 3600,
              "hook_before_user_created_enabled": True,
              "hook_before_user_created_uri": "pg-functions://postgres/public/pasr_before_user_created",
          })
          have = [u.strip() for u in (cur.get("uri_allow_list") or "").split(",") if u.strip()]
          need = [u for u in ("https://pasr.nl/bevestigen/", "https://pasr.nl/account/", "pasr://account") if u not in have]
          if need:
              cfg["uri_allow_list"] = ",".join(have + need)
          # strengere bestaande limieten blijven staan
          for key, value in (("rate_limit_otp", 10), ("rate_limit_verify", 20)):
              if not isinstance(cur.get(key), int) or cur[key] > value:
                  cfg[key] = value
          if all(os.environ.get(k) for k in ("S_HOST", "S_USER", "S_PASS", "S_FROM")):
              cfg.update({"smtp_host": os.environ["S_HOST"], "smtp_port": str(os.environ.get("S_PORT") or "465"),
                          "smtp_user": os.environ["S_USER"], "smtp_pass": os.environ["S_PASS"],
                          "smtp_admin_email": os.environ["S_FROM"], "smtp_sender_name": "Pasr",
                          "rate_limit_email_sent": 30})
              print("::notice::Mails go out via your own SMTP server as " + os.environ["S_FROM"])
          else:
              print("::warning::No PASR_SMTP_* secrets: Supabase sends the mails itself (only a few per hour). Add them for real use.")
          try:
              call("PATCH", cfg)
          except urllib.error.HTTPError as e:
              print("::error::Auth settings failed: HTTP", e.code, e.read()[:400].decode(errors="replace"))
              raise SystemExit(1)
          print("::notice::Branded mails, honeypot hook and Auth settings are set (links go to pasr.nl/bevestigen/).")
          PY
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != '1'
        with:
          version: latest
      - name: Apple Wallet function (wallet-pass)
        if: steps.check.outputs.skip != '1'
        env:
          P12: ${{ secrets.PASS_CERT_P12 }}
          PW: ${{ secrets.PASS_CERT_PASSWORD }}
          PTID: ${{ secrets.PASS_TYPE_ID }}
          PK: ${{ secrets.PASR_SUPABASE_KEY }}
        run: |
          supabase functions deploy wallet-pass --yes --project-ref "$REF" --no-verify-jwt --use-api
          if [ -n "$P12" ]; then
            supabase secrets set --yes --project-ref "$REF" \
              PASS_CERT_P12="$P12" PASS_CERT_PASSWORD="$PW" PASS_TYPE_ID="${PTID:-pass.nl.lrvdlinden.pasr}" \
              PASS_TEAM_ID=EU3UY476T6 PASR_PUBLISHABLE_KEY="$PK" >/dev/null
            echo "::notice::Wallet function deployed and certificate set."
          else
            echo "::warning::PASS_CERT_P12 missing: the Wallet function is deployed but can't sign passes yet."
          fi
      - name: Google Wallet function (google-wallet)
        if: steps.check.outputs.skip != '1'
        env:
          GW_ISSUER: ${{ secrets.GOOGLE_WALLET_ISSUER_ID }}
          GW_SA: ${{ secrets.GOOGLE_WALLET_SA_JSON }}
          PK: ${{ secrets.PASR_SUPABASE_KEY }}
        run: |
          set -euo pipefail
          if curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1; then
            ~/.deno/bin/deno test --no-check -A supabase/functions/google-wallet/ || { echo "::error::Tests of the google-wallet function failed"; exit 1; }
          fi
          # Pasr voor Android: "Opslaan in Google Wallet" (eigen apikey-controle, Google haalt logo's op zonder JWT)
          supabase functions deploy google-wallet --yes --project-ref "$REF" --no-verify-jwt --use-api
          if [ -n "$GW_ISSUER" ] && [ -n "$GW_SA" ]; then
            # De JSON mag als tekst of als base64 in de secret staan; nooit in het log
            supabase secrets set --yes --project-ref "$REF" GOOGLE_WALLET_ISSUER_ID="$GW_ISSUER" GOOGLE_WALLET_SA_JSON="$GW_SA" >/dev/null
            echo "::notice::google-wallet deployed and Google Wallet issuer set."
          else
            echo "::warning::GOOGLE_WALLET_ISSUER_ID / GOOGLE_WALLET_SA_JSON missing: google-wallet is deployed, the Android app hides the Google Wallet button."
          fi
          code=$(curl -s -o /tmp/gw.json -w '%{http_code}' -X POST "https://$REF.supabase.co/functions/v1/google-wallet" \
            -H "apikey: $PK" -H "Content-Type: application/json" -d '{"action":"status"}')
          echo "::notice::google-wallet status: HTTP $code $(cat /tmp/gw.json 2>/dev/null | head -c 100)"
      - name: Beheer function (admin)
        if: steps.check.outputs.skip != '1'
        env:
          A_USER: ${{ secrets.PASR_ADMIN_USER }}
          A_PASS: ${{ secrets.PASR_ADMIN_PASSWORD }}
          APNS_P8: ${{ secrets.PASR_APNS_KEY_P8 }}
          APNS_ID: ${{ secrets.PASR_APNS_KEY_ID }}
          APNS_TEAM: ${{ secrets.PASR_APNS_TEAM_ID }}
          FCM_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          deno_ok=1
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || deno_ok=0
          if [ "$deno_ok" = 1 ]; then
            ~/.deno/bin/deno test --no-check supabase/functions/admin/ || { echo "::error::Tests of the admin function failed"; exit 1; }
          fi
          supabase functions deploy admin --yes --project-ref "$REF" --no-verify-jwt --use-api
          # Pasr Zakelijk: huisstijl van de website van een zaak (eigen JWT-controle in de functie, SSRF-beveiligd)
          if [ "$deno_ok" = 1 ]; then
            ~/.deno/bin/deno test --no-check -A supabase/functions/business-brand/ || { echo "::error::Tests of the business-brand function failed"; exit 1; }
          fi
          supabase functions deploy business-brand --yes --project-ref "$REF" --no-verify-jwt --use-api
          # Where the database reaches the function (push notifications via pg_net)
          python3 -c 'import json,os;print(json.dumps({"query":"update public.pasr_admin_config set admin_url = '"'"'https://%s.supabase.co/functions/v1/admin'"'"' where id = 1" % os.environ["REF"]}))' > /tmp/u.json
          curl -sf -o /dev/null -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/u.json
          args=()
          # Token secret: made once, never in GitHub
          if ! supabase secrets list --project-ref "$REF" 2>/dev/null | grep -q PASR_TOKEN_SECRET; then
            args+=("PASR_TOKEN_SECRET=$(openssl rand -hex 32)")
          fi
          if [ -n "$A_USER" ] && [ -n "$A_PASS" ]; then
            [ ${#A_PASS} -ge 6 ] || { echo "::error::PASR_ADMIN_PASSWORD must be at least 6 characters"; exit 1; }
            args+=("PASR_ADMIN_USER=$A_USER" "PASR_ADMIN_PASSWORD=$A_PASS")
          else
            echo "::warning::PASR_ADMIN_USER / PASR_ADMIN_PASSWORD missing: you can't log in to Pasr Beheer yet."
          fi
          if [ -n "$APNS_P8" ] && [ -n "$APNS_ID" ]; then
            args+=("APNS_KEY_P8=$APNS_P8" "APNS_KEY_ID=$APNS_ID" "APNS_TEAM_ID=${APNS_TEAM:-EU3UY476T6}")
          else
            echo "::warning::PASR_APNS_KEY_P8 / PASR_APNS_KEY_ID missing: no push notifications yet (run Pasr push in app.lrvdlinden.secrets)."
          fi
          # Android-push (FCM HTTP v1): service-account van Firebase; als base64, zodat de JSON veilig als één waarde gaat
          if [ -n "$FCM_SA" ]; then
            args+=("FIREBASE_SERVICE_ACCOUNT_JSON=$(printf '%s' "$FCM_SA" | base64 -w0)")
          else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON missing: no push notifications to Android (FCM)."
          fi
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --yes --project-ref "$REF" "${args[@]}" >/dev/null; fi
          echo "::notice::Admin function deployed."
      - name: Gedeelde Pasr function (group-invite)
        if: steps.check.outputs.skip != '1'
        env:
          S_HOST: ${{ secrets.PASR_SMTP_HOST }}
          S_PORT: ${{ secrets.PASR_SMTP_PORT }}
          S_USER: ${{ secrets.PASR_SMTP_USER }}
          S_PASS: ${{ secrets.PASR_SMTP_PASSWORD }}
          S_FROM: ${{ secrets.PASR_SMTP_FROM }}
        run: |
          set -euo pipefail
          if [ -x ~/.deno/bin/deno ]; then
            ~/.deno/bin/deno test --no-check --allow-env supabase/functions/group-invite/ || { echo "::error::Tests of the group-invite function failed"; exit 1; }
          fi
          # De database controleert het token (pasr_group_invite met de JWT van de gebruiker)
          supabase functions deploy group-invite --yes --project-ref "$REF" --no-verify-jwt --use-api
          if [ -n "$S_HOST" ] && [ -n "$S_USER" ] && [ -n "$S_PASS" ] && [ -n "$S_FROM" ]; then
            supabase secrets set --yes --project-ref "$REF" PASR_SMTP_HOST="$S_HOST" PASR_SMTP_PORT="${S_PORT:-465}" \
              PASR_SMTP_USER="$S_USER" PASR_SMTP_PASSWORD="$S_PASS" PASR_SMTP_FROM="$S_FROM" >/dev/null
            echo "::notice::group-invite deployed; invitation mails go out as $S_FROM."
          else
            echo "::warning::No PASR_SMTP_* secrets: invitations are made but no mail is sent (they still show up in the app)."
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$REF.supabase.co/functions/v1/group-invite" -H "Content-Type: application/json" -d '{}')
          [ "$code" = 401 ] && echo "::notice::group-invite is up and asks for a login." || echo "::warning::group-invite: unexpected HTTP $code"
      - name: Herinneringen per e-mail (reminder-mail)
        if: steps.check.outputs.skip != '1'
        run: |
          set -euo pipefail
          if [ -x ~/.deno/bin/deno ]; then
            ~/.deno/bin/deno test --no-check --allow-env supabase/functions/reminder-mail/ || { echo "::error::Tests of the reminder-mail function failed"; exit 1; }
          fi
          # Alleen de database roept hem aan (kop x-pasr-hook); de SMTP-secrets zijn dezelfde als die van group-invite
          supabase functions deploy reminder-mail --yes --project-ref "$REF" --no-verify-jwt --use-api
          python3 -c 'import json,os;print(json.dumps({"query":"update public.pasr_admin_config set reminder_url = '"'"'https://%s.supabase.co/functions/v1/reminder-mail'"'"' where id = 1" % os.environ["REF"]}))' > /tmp/m.json
          curl -sf -o /dev/null -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/m.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$REF.supabase.co/functions/v1/reminder-mail" -H "Content-Type: application/json" -d '{"action":"run"}')
          [ "$code" = 403 ] && echo "::notice::reminder-mail is up and only answers the database." || echo "::warning::reminder-mail: unexpected HTTP $code"
      - name: Smoke test (Wallet pass and admin)
        if: steps.check.outputs.skip != '1'
        env:
          PK: ${{ secrets.PASR_SUPABASE_KEY }}
          A_USER: ${{ secrets.PASR_ADMIN_USER }}
          A_PASS: ${{ secrets.PASR_ADMIN_PASSWORD }}
        run: |
          U="https://$REF.supabase.co/functions/v1"
          sleep 5
          code=$(curl -s -o /tmp/t.pkpass -w '%{http_code}' -X POST "$U/wallet-pass" -H "apikey: $PK" -H "Content-Type: application/json" \
            -d '{"id":"00000000-0000-4000-8000-000000000001","name":"Test","number":"2620000000000","format":"ean13","colorHex":"#00A0E2","kind":"loyalty"}')
          if [ "$code" = 200 ] && mkdir -p /tmp/pk && unzip -oq /tmp/t.pkpass -d /tmp/pk \
             && openssl smime -verify -binary -inform DER -in /tmp/pk/signature -content /tmp/pk/manifest.json -noverify -out /dev/null 2>/dev/null; then
            echo "::notice::Wallet: test pass made and signed ($(openssl pkcs7 -inform DER -in /tmp/pk/signature -print_certs -noout | grep -o 'CN *= *Pass Type ID[^,]*' | head -1))."
          else
            echo "::warning::Wallet: test pass failed (HTTP $code). Check PASS_CERT_P12 / PASS_CERT_PASSWORD."
          fi
          code=$(curl -s -o /tmp/a.json -w '%{http_code}' -X POST "$U/admin" -H "Content-Type: application/json" -d '{"action":"stats"}')
          case "$code" in
            401) echo "::notice::Admin: function is up and asks for a login." ;;
            503) echo "::warning::Admin: function is up but PASR_ADMIN_USER / PASR_ADMIN_PASSWORD are not set." ;;
            *) echo "::warning::Admin: unexpected HTTP $code" ;;
          esac
          # Inloggen met de secrets zelf (niets ervan in het log): klopt de login die in GitHub staat?
          if [ -n "$A_USER" ] && [ -n "$A_PASS" ]; then
            python3 -c 'import json,os;print(json.dumps({"action":"login","user":os.environ["A_USER"].strip(),"password":os.environ["A_PASS"]}))' > /tmp/l.json
            code=$(curl -s -o /tmp/l.out -w '%{http_code}' -X POST "$U/admin" -H "Content-Type: application/json" --data @/tmp/l.json)
            rm -f /tmp/l.json
            case "$code" in
              200)
              python3 - <<'PY_STATS'
          import json, urllib.request, os
          with open("/tmp/l.out") as file:
              token = json.load(file)["token"]
          url = f"https://{os.environ['REF']}.supabase.co/functions/v1/admin"
          request = urllib.request.Request(url, data=b'{"action":"stats"}', headers={
              "Content-Type": "application/json", "Authorization": f"Bearer {token}"
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              total = json.load(response).get("business_accounts")
          if type(total) is not int or total < 0:
              raise SystemExit("Admin: het aantal zakelijke accounts ontbreekt.")
          print("::notice::Admin: zakelijke accounttelling gecontroleerd.")
          PY_STATS
              ;;
              429) echo "::warning::Admin: login is locked for 15 minutes after too many wrong attempts." ;;
              *) echo "::warning::Admin: login with the GitHub secrets failed (HTTP $code, $(python3 -c 'import json;print(json.load(open("/tmp/l.out")).get("error",""))' 2>/dev/null))." ;;
            esac
          fi
      - name: Winkelcatalogus (eenmalige vulling; bestaande winkels in het beheer blijven zoals ze zijn)
        if: steps.check.outputs.skip != '1' && hashFiles('supabase/catalog/stores.json') != ''
        run: python3 supabase/catalog/seed.py
      - name: Cadeaubon-gids (alleen waar de gids nog leeg is; aanpassingen in het beheer blijven staan)
        if: steps.check.outputs.skip != '1' && hashFiles('supabase/catalog/guides.json') != ''
        run: python3 supabase/catalog/guides.py
      - name: Logo en merkkleur van evenementtickets (alleen waar nog geen logo of nog de neutrale kleur; het beheer is leidend)
        if: steps.check.outputs.skip != '1' && hashFiles('supabase/catalog/ticket_brands.json') != ''
        run: python3 supabase/catalog/ticket_brands.py
      - name: Kaartontwerpen van cadeaukaarten (alleen waar de cover nog leeg is; het beheer is leidend)
        if: steps.check.outputs.skip != '1' && hashFiles('supabase/catalog/covers.json') != ''
        run: python3 supabase/catalog/covers.py
