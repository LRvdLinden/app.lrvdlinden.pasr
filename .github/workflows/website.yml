name: Website

# Uploads the website/ folder to the web server via FTPS (encrypted, certificate checked) on every push
# that changes the site, or by hand (Actions › Website › Run workflow).
# Elke deploy bouwt /kaarten/, /cadeaubon/, /klantenkaart/, de homepage en de sitemap opnieuw op uit de beheer-database
# (tools/fetch_live_catalog.py). Elk uur draait de workflow ook vanzelf (schedule), zodat wijzigingen in het beheer
# (winkels, logo's, kaartontwerpen, gidsen, saldo-pagina's, stempelkaarten en hun deelpagina's /zakelijk/kaart/<id>/ met
# OG-afbeelding) binnen het uur op pasr.nl staan; dan wordt
# alleen geüpload wat echt anders is (website/assets/deploy-manifest.json op de server).
# Repository secrets: FTP_SERVER, FTP_USER, FTP_PASSWORD; optional FTP_PORT (21 = FTPS, 22 = SFTP) and FTP_DIR.
# Safety: if the target folder already holds a website that is not Pasr, nothing is uploaded.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml", "tools/make_*.py", "tools/store_catalog.py",
            "tools/fetch_live_catalog.py", "supabase/catalog/**"]
  schedule:
    - cron: "17 * * * *"   # elk uur: bijwerken uit het beheer (uploadt alleen als er iets veranderd is)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate promo JavaScript and page generator
        run: |
          node --check website/assets/promo.js
          node --check website/assets/zakelijk.js
          python3 -m py_compile tools/make_zakelijk.py
      - name: Account settings for the website
        env:
          A_URL: ${{ secrets.PASR_SUPABASE_URL }}
          A_KEY: ${{ secrets.PASR_SUPABASE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          url, key = (os.environ.get("A_URL") or "").strip().rstrip("/"), (os.environ.get("A_KEY") or "").strip()
          open("website/assets/account-config.js", "w").write(
              "// Written by the Website workflow (public values).\nwindow.PASR_ACCOUNT = " + json.dumps({"url": url, "key": key}) + ";\n")
          print("Account config:", "set" if url and key else "empty (secrets PASR_SUPABASE_URL / PASR_SUPABASE_KEY missing)")
          PY
      - name: "Android-APK's: Pasr naar /download/, Pasr Zakelijk naar /zakelijk/download/"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Haalt de nieuwste ondertekende APK op: eerst uit de branch android-builds, dan de releases, anders het
          # nieuwste artifact van de Android-workflow. Ontbreekt er een, dan blijft wat er op de server staat staan.
          set -uo pipefail
          mkdir -p website/download
          git fetch -q --depth 1 origin android-builds:refs/remotes/origin/android-builds 2>/dev/null || true
          fetch() {  # $1 = naam (pasr / pasr-zakelijk), $2 = tag-voorvoegsel, $3 = workflowbestand, $4 = artifact, $5 = map op de site
            local name=$1 prefix=$2 wf=$3 art=$4 dest=$5 tmp; tmp=$(mktemp -d); tag=""; mkdir -p "$dest"
            # 1. de branch android-builds (de Android-workflows zetten daar de nieuwste APK neer)
            for dir in "$name" "${name#pasr-}"; do
              if git show "origin/android-builds:$dir/$name.apk" > "$tmp/$name.apk" 2>/dev/null; then
                git show "origin/android-builds:$dir/$name.json" > "$tmp/$name.json" 2>/dev/null || rm -f "$tmp/$name.json"
                tag="android-builds/$dir"; break
              fi
              rm -f "$tmp/$name.apk"
            done
            [ -f "$tmp/$name.apk" ] || tag=$(gh api "repos/$REPO/releases?per_page=50" --jq "[.[] | select(.tag_name | startswith(\"$prefix\"))][0].tag_name" 2>/dev/null || true)
            if [ ! -f "$tmp/$name.apk" ] && [ -n "$tag" ] && [ "$tag" != "null" ]; then
              gh release download "$tag" -R "$REPO" -D "$tmp" -p "*.apk" -p "*.json" >/dev/null 2>&1 || true
            fi
            if ! ls "$tmp"/*.apk >/dev/null 2>&1; then
              run=$(gh run list -R "$REPO" -w "$wf" -s success -L 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
              [ -n "$run" ] && gh run download "$run" -R "$REPO" -n "$art" -D "$tmp" >/dev/null 2>&1 || true
            fi
            apk=$(ls "$tmp"/$name.apk 2>/dev/null || ls -S "$tmp"/*.apk 2>/dev/null | head -1)
            if [ -z "$apk" ]; then echo "::warning::Geen APK gevonden voor $name"; return 0; fi
            cp "$apk" "$dest/$name.apk"
            if [ -f "$tmp/$name.json" ]; then cp "$tmp/$name.json" "$dest/$name.json"; else
              printf '{"app":"%s","size":%s,"sha256":"%s","date":"%s"}\n' "$name" "$(stat -c %s "$apk")" "$(sha256sum "$apk" | cut -d' ' -f1)" \
                "$(date -u +%Y-%m-%d)" > "$dest/$name.json"
            fi
            echo "::notice::$name.apk klaargezet ($(stat -c %s "$apk") bytes, ${tag:-artifact})"
          }
          fetch pasr android-pasr- android-pasr.yml Pasr-Android website/download
          # Pasr Zakelijk staat op pasr.nl/zakelijk/download/ (niet in /download/)
          fetch pasr-zakelijk android-zakelijk- android-zakelijk.yml PasrZakelijk-Android website/zakelijk/download
      - name: "OG-afbeeldingen van stempelkaarten uit de vorige run (alleen gewijzigde kaarten opnieuw maken)"
        uses: actions/cache@v4
        with:
          path: .cache/og-zakelijk
          key: og-zakelijk-${{ github.run_id }}
          restore-keys: og-zakelijk-
      - name: "Kaarten, cadeaubons, gidsen, deelpagina's van stempelkaarten en sitemap uit de beheer-database"
        continue-on-error: true   # lukt het niet, dan gaat de site uit de repo online
        env:
          PASR_SUPABASE_URL: ${{ secrets.PASR_SUPABASE_URL }}
          PASR_SUPABASE_KEY: ${{ secrets.PASR_SUPABASE_KEY }}
          # alleen om pasr_business_share_cards op te vragen (ook niet-vindbare kaarten krijgen een deelpagina met OG)
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          GEN="website/kaarten website/cadeaubon website/klantenkaart website/overstappen website/index.html website/sitemap.xml website/assets/kaarten website/assets/covers"
          python3 -m pip install --quiet --disable-pip-version-check Pillow python-barcode || true
          python3 tools/fetch_live_catalog.py
          [ -f .cache/live-catalog.json ] || echo "::warning::Geen live catalogus: de pagina's komen uit de repo."
          if python3 tools/make_website.py && python3 tools/make_sitemap.py; then
            python3 tools/store_catalog.py | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Opbouwen uit de database mislukt; de gegenereerde pagina's uit de repo worden gebruikt."
            git checkout -- $GEN 2>/dev/null || true
            git clean -fdq -- $GEN 2>/dev/null || true
          fi
      - name: Versie achter css en js (geen oude bestanden uit de cache)
        run: python3 tools/version_assets.py
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload via FTPS
        id: upload
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USER || secrets.FTP_USERNAME }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -euo pipefail
          note(){ echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; echo "$1" >> /tmp/report.txt; }
          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            note "FTP secrets missing (FTP_SERVER, FTP_USER, FTP_PASSWORD) — website not uploaded."
            exit 1
          fi
          trim(){ printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          FTP_SERVER=$(trim "$FTP_SERVER" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          FTP_USERNAME=$(trim "$FTP_USERNAME"); FTP_DIR=$(trim "${FTP_DIR:-}")
          PORT=$(trim "${FTP_PORT:-}" | tr -cd '0-9'); PORT="${PORT:-21}"
          export LFTP_PASSWORD=$(trim "$FTP_PASSWORD")
          CA=/tmp/ftp-ca.pem; cp /etc/ssl/certs/ca-certificates.crt "$CA"
          if [ "$PORT" = "22" ]; then
            # SFTP (SSH): encrypted; the server key is recorded on first use
            mkdir -p ~/.ssh; ssh-keyscan -p 22 -T 20 "$FTP_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
            common="set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set dns:order inet; set sftp:auto-confirm no"
            HOST="sftp://$FTP_SERVER"
            note "Connecting with SFTP (port 22)."
          else
            common="set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set dns:order inet; set ftp:passive-mode true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; set ssl:check-hostname yes; set ssl:ca-file $CA"
            ip_of(){ (getent ahostsv4 "$1" || true) | awk 'NR==1{print $1}'; }
            if [ "$PORT" = "990" ]; then tls="-connect"; else tls="-starttls ftp -connect"; fi
            sc(){ timeout 40 openssl s_client ${tls/-connect/} -connect "$1:$PORT" -servername "$1" "${@:2}" </dev/null 2>/dev/null; }
            add_chain(){
              local aia
              aia=$(sc "$1" | openssl x509 -noout -text 2>/dev/null | grep -oE 'CA Issuers - URI:[^ ]+' | sed 's/CA Issuers - URI://' | head -1 || true)
              [ -n "$aia" ] || return 0
              curl -fsSL --max-time 20 "$aia" -o /tmp/inter.bin 2>/dev/null || return 0
              openssl x509 -inform DER -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || openssl x509 -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || return 0
              cat /tmp/inter.pem >> "$CA"
            }
            cert_ok(){ sc "$1" -verify_hostname "$1" -verify_return_error -CAfile "$CA" | grep -q 'Verify return code: 0 (ok)'; }
            HOST=""
            base_ip=$(ip_of "$FTP_SERVER")
            [ -n "$base_ip" ] || { note "FTP_SERVER does not resolve."; exit 1; }
            add_chain "$FTP_SERVER"
            if cert_ok "$FTP_SERVER"; then HOST="$FTP_SERVER"; else
              names=$(sc "$FTP_SERVER" | openssl x509 -noout -ext subjectAltName -subject 2>/dev/null \
                | grep -oE '(DNS:|CN ?= ?)(\*\.)?[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' | sed -E 's/^(DNS:|CN ?= ?)//' | sort -u || true)
              ptr=$(getent hosts "$base_ip" 2>/dev/null | awk '{print $2}' | sed 's/\.$//' || true)
              cands="$ptr"; first="${FTP_SERVER%%.*}"
              for n in $names; do case "$n" in \*.*) cands="$cands $first.${n#\*.} ftp.${n#\*.}";; *) cands="$cands $n";; esac; done
              for n in $(echo $cands | tr ' ' '\n' | sort -u); do
                [ "$(ip_of "$n")" = "$base_ip" ] || continue
                if cert_ok "$n"; then HOST="$n"; break; fi
              done
            fi
            [ -n "$HOST" ] || { note "No valid FTPS certificate found for FTP_SERVER on port $PORT. The server's certificate is for: $(echo $names | tr '\n' ' ')${ptr:+ (reverse DNS: $ptr)}. Set the secret FTP_SERVER to one of those names (the one your hosting gives for FTP)."; exit 1; }
            [ "$PORT" = "990" ] && HOST="ftps://$HOST"
          fi
          run(){ lftp -e "$common; open -p $PORT --env-password -u \"$FTP_USERNAME\" \"$HOST\"; $1; bye"; }
          ok=""
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && sleep 30
            if run "cls -1 > /tmp/root.txt" 2>/tmp/err.txt; then ok=1; break; fi
            echo "Login attempt $attempt failed: $(grep -viE 'user|pass' /tmp/err.txt | tr '\n' ' ' | tail -c 200)"
          done
          if [ -z "$ok" ]; then
            msg=$(grep -viE 'user|pass|@' /tmp/err.txt | tr '\n' ' ' | sed "s/$FTP_USERNAME/***/g" | tail -c 300 || true)
            note "Login to the FTP server failed (host checked: $([ "$HOST" = "$FTP_SERVER" ] && echo FTP_SERVER || echo "$HOST"), port $PORT). Server said: ${msg:-no message}"
            exit 1
          fi
          # target folder: FTP_DIR, else a common web root, else the login folder
          TARGET="$FTP_DIR"
          if [ -z "$TARGET" ]; then
            for d in public_html httpdocs www htdocs; do
              if grep -qx "/\?$d/\?" /tmp/root.txt; then TARGET="$d"; break; fi
            done
          fi
          TARGET="${TARGET:-.}"
          # safety: never overwrite another website
          rm -f /tmp/remote-index.html
          run "get \"$TARGET/index.html\" -o /tmp/remote-index.html" >/dev/null 2>&1 || true
          if [ -s /tmp/remote-index.html ] && ! grep -qi "pasr" /tmp/remote-index.html; then
            note "Stopped: the target folder already has another website (no Pasr in index.html). Set the secret FTP_DIR to the folder of the pasr.nl domain."
            exit 1
          fi
          # Alleen uploaden wat anders is dan de vorige keer: vergelijk met het manifest (sha256 per bestand) op de server.
          # Geen manifest op de server, of push / met de hand: alles met mirror. Elk uur (schedule) zonder wijzigingen: niets.
          rm -f /tmp/manifest.remote
          run "get \"$TARGET/assets/deploy-manifest.json\" -o /tmp/manifest.remote" >/dev/null 2>&1 || true
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          site = pathlib.Path("website")
          files = {str(p.relative_to(site)): hashlib.sha256(p.read_bytes()).hexdigest()[:20]
                   for p in sorted(site.rglob("*")) if p.is_file() and p.name not in (".DS_Store", ".htaccess", "deploy-manifest.json")}
          try:
              old = json.load(open("/tmp/manifest.remote"))
              old = old if isinstance(old, dict) else None
          except (OSError, ValueError):
              old = None
          changed = [f for f, h in files.items() if old is None or old.get(f) != h]
          stage = pathlib.Path("/tmp/stage"); shutil.rmtree(stage, ignore_errors=True); stage.mkdir()
          for f in changed:
              (stage / f).parent.mkdir(parents=True, exist_ok=True); shutil.copy2(site / f, stage / f)
          (site / "assets" / "deploy-manifest.json").write_text(json.dumps(files, separators=(",", ":")))
          open("/tmp/changed.txt", "w").write("\n".join(changed))
          # Pagina's en plaatjes van kaarten die niet meer in de database staan: ook van de server af (alleen gegenereerde mappen).
          gen = ("kaarten/", "cadeaubon/", "klantenkaart/", "assets/kaarten/", "assets/covers/")
          # deelpagina's en OG-afbeeldingen van stempelkaarten: alleen weghalen als de volledige lijst is opgehaald
          try:
              if json.load(open(".cache/kaart-pages.json")).get("mode") == "full":
                  gen += ("zakelijk/kaart/", "og/zakelijk/")
          except (OSError, ValueError):
              pass
          gone = [f for f in (old or {}) if f not in files and f.startswith(gen) and ".." not in f and '"' not in f]
          open("/tmp/removed.txt", "w").write("\n".join(gone))
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write(f"changed={len(changed)}\nfull={'1' if old is None else '0'}\n")
          print(f"{len(changed)} van {len(files)} bestanden anders" + (" (geen manifest op de server)" if old is None else ""))
          PY
          CHANGED=$(grep -c . /tmp/changed.txt || true)
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "${CHANGED:-0}" = "0" ]; then
            note "Elk-uur-controle: niets veranderd in het beheer, niets geüpload."
            exit 0
          fi
          if [ -s /tmp/manifest.remote ] && [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            run "mirror -R --verbose --parallel=4 --exclude-glob .DS_Store /tmp/stage/ \"$TARGET\""
          else
            run "mirror -R --verbose --parallel=4 --only-newer --exclude-glob .DS_Store --exclude-glob .htaccess --exclude-glob deploy-manifest.json website/ \"$TARGET\""
          fi
          if [ -s /tmp/removed.txt ]; then
            cmds=$(sed "s#.*#rm -f \"$TARGET/&\"#" /tmp/removed.txt | paste -sd';' -)
            run "set cmd:fail-exit false; $cmds" >/dev/null 2>&1 || true
            # lege mappen van verdwenen stempelkaarten
            dirs=$(grep -oE '^zakelijk/kaart/[0-9a-f-]{36}/' /tmp/removed.txt | sort -u | sed "s#.*#rmdir \"$TARGET/&\"#" | paste -sd';' - || true)
            [ -n "$dirs" ] && run "set cmd:fail-exit false; $dirs" >/dev/null 2>&1 || true
            note "Weggehaald van de server: $(grep -c . /tmp/removed.txt) bestand(en) van kaarten die niet meer in het beheer staan."
          fi
          # het manifest als laatste: pas als alles erop staat
          run "put website/assets/deploy-manifest.json -o \"$TARGET/assets/deploy-manifest.json\""
          note "Bijgewerkt: $CHANGED bestand(en) anders dan de vorige upload."
          # .htaccess (clean URLs): keep anything the hoster put there, replace only our block
          rm -f /tmp/htaccess.remote
          run "get \"$TARGET/.htaccess\" -o /tmp/htaccess.remote" >/dev/null 2>&1 || true
          python3 - <<'PY'
          import os, re
          ours = open("website/.htaccess").read().strip("\n")
          old = open("/tmp/htaccess.remote").read() if os.path.exists("/tmp/htaccess.remote") else ""
          old = re.sub(r"\n?# BEGIN pasr.*?# END pasr\n?", "\n", old, flags=re.S).strip("\n")
          open("/tmp/htaccess.new", "w").write(ours + ("\n\n" + old if old else "") + "\n")
          PY
          run "put /tmp/htaccess.new -o \"$TARGET/.htaccess\""
          note "Website uploaded (port $PORT) to ${FTP_DIR:+the FTP_DIR folder}${FTP_DIR:-$TARGET} on the server (certificate checked)."
      - name: Report on the commit
        # elk uur (schedule) geen opmerking bij de commit, behalve als het misgaat
        if: always() && (github.event_name != 'schedule' || steps.upload.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### Website: ${{ steps.upload.outcome }}"; cat /tmp/report.txt 2>/dev/null || true; } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null
