name: Website

# Publishes the website/ folder to pasr.nl over FTP.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER, FTP_USER, FTP_PASSWORD, and optionally FTP_PORT (default: 21) and FTP_DIR (default: /)
# Until FTP_SERVER is set, the upload is skipped.

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAW_SERVER: ${{ secrets.FTP_SERVER }}
      RAW_PORT: ${{ secrets.FTP_PORT }}
      RAW_DIR: ${{ secrets.FTP_DIR }}
    steps:
      - name: Prepare and check the FTP connection
        id: check
        run: |
          if [ -z "$RAW_SERVER" ]; then
            echo "::warning::FTP_SERVER is not set yet; skipping the upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Accept "ftp://host", "host/path", "host:21" and stray spaces or newlines.
          host=$(printf '%s' "$RAW_SERVER" | tr -d '[:space:]')
          case "$host" in *://*) echo "::warning::FTP_SERVER contained a scheme (like ftp://); it was removed."; host="${host#*://}";; esac
          host="${host%%/*}"
          port=$(printf '%s' "$RAW_PORT" | tr -d '[:space:]')
          case "$host" in *:*) [ -z "$port" ] && port="${host##*:}"; host="${host%%:*}";; esac
          [ -z "$port" ] && port=21
          dir=$(printf '%s' "$RAW_DIR" | tr -d '[:space:]')
          [ -z "$dir" ] && dir=/
          case "$dir" in */) ;; *) dir="$dir/";; esac

          echo "FTP_HOST=$host" >> "$GITHUB_ENV"
          echo "FTP_PORT_CLEAN=$port" >> "$GITHUB_ENV"
          echo "FTP_DIR_CLEAN=$dir" >> "$GITHUB_ENV"

          if ! getent hosts "$host" > /dev/null; then
            echo "::error::The FTP server name in FTP_SERVER does not resolve in DNS. Check the spelling."
            exit 1
          fi
          if timeout 10 bash -c "</dev/tcp/$host/$port" 2>/dev/null; then
            echo "::notice::FTP server is reachable on port $port."
          else
            hint=""
            if [ "$port" != "990" ] && timeout 10 bash -c "</dev/tcp/$host/990" 2>/dev/null; then hint=" Port 990 is open: the host may need implicit FTPS (set FTP_PORT to 990)."; fi
            echo "::error::Cannot connect to the FTP server on port $port. It may block connections from GitHub, or the port is wrong.$hint"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Upload to pasr.nl
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.FTP_PORT_CLEAN }}
          protocol: ${{ env.FTP_PORT_CLEAN == '990' && 'ftps-legacy' || 'ftp' }}
          local-dir: website/
          server-dir: ${{ env.FTP_DIR_CLEAN }}
          timeout: 120000
