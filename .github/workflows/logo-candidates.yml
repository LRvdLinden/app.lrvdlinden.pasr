name: Logo candidates

# Builds contact sheets of brand logos from Wikimedia Commons (tools/logo_candidates.py) and puts them on the
# branch logo-candidates, to pick the right logo per store by hand. Run from Actions with a list of brands.
on:
  workflow_dispatch:
    inputs:
      brands:
        description: 'domain=Name pairs separated by ";", e.g. ah.nl=Albert Heijn; hm.com=H&M'
        type: string
        required: true

permissions:
  contents: write

jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow
      - name: Build sheets
        env:
          BRANDS: ${{ inputs.brands }}
        run: python tools/logo_candidates.py "$BRANDS"
      - name: Push to branch logo-candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cp -r tools/candidates /tmp/candidates
          git checkout --orphan logo-candidates
          git rm -rfq .
          cp -r /tmp/candidates/* .
          git add -A
          git commit -qm "Logo candidates"
          git push -f origin logo-candidates
