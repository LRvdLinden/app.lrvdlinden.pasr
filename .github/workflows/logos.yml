name: Logos

# Fetches the logo of every store in StoreTemplates.swift into App/StoreLogos/ and commits them,
# so the app shows logos straight away. Runs when the store list changes, or by hand
# (Actions › Logos › Run workflow; tick "all" to fetch every logo again).
on:
  push:
    branches: [main]
    paths: ["Shared/Model/StoreTemplates.swift", "tools/fetch_logos.py", "tools/brand_overrides.json", ".github/workflows/logos.yml"]
  workflow_dispatch:
    inputs:
      all:
        description: "Fetch all logos again"
        type: boolean
        default: false
      debug:
        description: "Only test these domains (space separated) and show what each address returns"
        type: string
        default: ""
      tickets:
        description: "Event tickets: fetch logo and brand colour of the event sites in supabase/catalog/new_tickets.json"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: logos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow cairosvg
      - if: ${{ inputs.debug != '' && inputs.debug != null }}
        run: python tools/fetch_logos.py --debug ${{ inputs.debug }}
      - if: ${{ (inputs.debug == '' || inputs.debug == null) && !inputs.tickets }}
        run: python tools/fetch_logos.py ${{ inputs.all && '--all' || '' }}
      - if: ${{ inputs.tickets }}
        run: python tools/fetch_logos.py --tickets ${{ inputs.all && '--all' || '' }}
      - name: Commit logos
        if: ${{ inputs.debug == '' || inputs.debug == null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add App/StoreLogos Shared/Model/StoreLogoStyles.swift Shared/Model/StoreColourHistory.swift tools/logos-missing.txt tools/logo-styles.json tools/colour-history.json
          if [ -f supabase/catalog/ticket_brands.json ]; then git add supabase/catalog/ticket_brands.json; fi
          if git diff --cached --quiet; then echo "No new logos."; exit 0; fi
          git commit -m "Winkellogo's bijgewerkt"
          git pull --rebase -q
          git push
          # Een push met GITHUB_TOKEN start geen andere workflows: zet tickets meteen in het beheer via de Backend-workflow.
          if ${{ inputs.tickets == true }}; then
            gh workflow run backend.yml --ref main -R "${{ github.repository }}" && echo "::notice::Backend gestart: logo's en kleuren van tickets gaan naar het beheer."
          fi
