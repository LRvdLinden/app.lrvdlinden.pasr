name: Logos

# Fetches the logo of every store in StoreTemplates.swift into Shared/StoreLogos/ and commits them,
# so the app shows logos straight away. Runs when the store list changes, or by hand
# (Actions › Logos › Run workflow; tick "all" to fetch every logo again).
on:
  push:
    branches: [main]
    paths: ["Shared/Model/StoreTemplates.swift", "tools/fetch_logos.py", ".github/workflows/logos.yml"]
  workflow_dispatch:
    inputs:
      all:
        description: "Fetch all logos again"
        type: boolean
        default: false
      debug:
        description: "Only test these domains (space separated) and show what each address returns"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: logos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow
      - if: ${{ inputs.debug != '' && inputs.debug != null }}
        run: python tools/fetch_logos.py --debug ${{ inputs.debug }}
      - if: ${{ inputs.debug == '' || inputs.debug == null }}
        run: python tools/fetch_logos.py ${{ inputs.all && '--all' || '' }}
      - name: Commit logos
        if: ${{ inputs.debug == '' || inputs.debug == null }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Shared/StoreLogos tools/logos-missing.txt
          if git diff --cached --quiet; then echo "No new logos."; exit 0; fi
          git commit -m "Winkellogo's bijgewerkt"
          git pull --rebase -q
          git push
