name: Pasr Zakelijk Xcode-project ZIP

on:
  push:
    branches: [main]
    paths:
      - "zakelijk/apple/**"
      - ".github/workflows/xcode-zakelijk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    name: Complete Pasr Zakelijk Xcode-project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controleer versie en bouw volledig Xcode-project ZIP
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'BUILD = "18"' zakelijk/apple/make_project.py
          grep -q 'VERSION = "1.0.4"' zakelijk/apple/make_project.py
          grep -q 'CURRENT_PROJECT_VERSION = "18"' zakelijk/apple/PasrZakelijk.xcodeproj/project.pbxproj
          work="$(mktemp -d)"
          mkdir -p "$work/Pasr-Zakelijk-1.0.4-build18" dist
          cp -a zakelijk/apple/. "$work/Pasr-Zakelijk-1.0.4-build18/"
          cat > "$work/Pasr-Zakelijk-1.0.4-build18/OPEN-IN-XCODE.md" <<'INFO'
          # Pasr Zakelijk 1.0.4 (build 18)
          Open PasrZakelijk.xcodeproj in Xcode.
          Selecteer de PasrZakelijk scheme, configureer je Apple Developer Team
          en Signing & Capabilities. Kies Product > Archive en verzend via
          Organizer > Distribute App > App Store Connect.
          Inclusief alle Swift-code, iconen, assets, projectinstellingen en
          complete gezamenlijke acties (stoppen, uitstappen, uitgeven bij het scannen).
          INFO
          (cd "$work" && zip -qr "$GITHUB_WORKSPACE/dist/Pasr-Zakelijk-Xcode-1.0.4-build18.zip" Pasr-Zakelijk-1.0.4-build18)
          unzip -tq dist/Pasr-Zakelijk-Xcode-1.0.4-build18.zip
          ls -lh dist/*.zip
      - name: Oplevering GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pasr-Zakelijk-Xcode-1.0.4-build18
          path: dist/Pasr-Zakelijk-Xcode-1.0.4-build18.zip
          retention-days: 90
      - name: Oplevering ZIP als GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="xcode-zakelijk-1.0.4-18"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --latest=false --title "Pasr Zakelijk 1.0.4 (build 18) – Xcode-project" --notes "Volledig Xcode-bronproject met complete gezamenlijke acties (stoppen, uitstappen, uitgeven bij het scannen). Open de .xcodeproj in Xcode, Archive en upload zelf naar App Store Connect."
          fi
          gh release upload "$TAG" dist/Pasr-Zakelijk-Xcode-1.0.4-build18.zip --clobber
