<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Pasr App Store</title>
<style>
@font-face { font-family: "Bricolage"; font-weight: 600; src: url(fonts/bricolage-grotesque-latin-600-normal.woff2); }
@font-face { font-family: "Bricolage"; font-weight: 700; src: url(fonts/bricolage-grotesque-latin-700-normal.woff2); }
@font-face { font-family: "Bricolage"; font-weight: 800; src: url(fonts/bricolage-grotesque-latin-800-normal.woff2); }
@font-face { font-family: "Figtree"; font-weight: 400; src: url(fonts/figtree-latin-400-normal.woff2); }
@font-face { font-family: "Figtree"; font-weight: 500; src: url(fonts/figtree-latin-500-normal.woff2); }
@font-face { font-family: "Figtree"; font-weight: 600; src: url(fonts/figtree-latin-600-normal.woff2); }
@font-face { font-family: "Figtree"; font-weight: 700; src: url(fonts/figtree-latin-700-normal.woff2); }
@font-face { font-family: "Figtree"; font-weight: 800; src: url(fonts/figtree-latin-800-normal.woff2); }
:root {
  --ink: #0A0B10; --raised: #15171F; --raised2: #1E2130; --line: #2A2E3D; --muted: #9A98B3;
  --iris: #6A5CFF; --coral: #FF6B57; --mint: #2ED3A6; --paper: #F4F3FF; --deep: #17162A;
  --ui: "Inter", -apple-system, "SF Pro Text", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--w); height: var(--h); overflow: hidden; }
body { font-family: "Figtree", sans-serif; -webkit-font-smoothing: antialiased; }
img { display: block; }

/* ---------- canvas (marketing) ---------- */
.canvas { position: relative; width: var(--w); height: var(--h); overflow: hidden; color: #fff; }
.canvas.dark { background: radial-gradient(60% 40% at 50% 0%, rgba(106, 92, 255, .45), transparent 70%),
  radial-gradient(50% 35% at 100% 100%, rgba(255, 107, 87, .28), transparent 70%), var(--ink); }
.canvas.light { color: var(--deep); background: radial-gradient(60% 40% at 50% 0%, rgba(106, 92, 255, .22), transparent 70%),
  radial-gradient(50% 35% at 0% 100%, rgba(46, 211, 166, .22), transparent 70%), var(--paper); }
.canvas.iris { background: radial-gradient(70% 45% at 20% 0%, rgba(255, 255, 255, .22), transparent 70%),
  linear-gradient(160deg, #7B6EFF 0%, #5544F0 55%, #3E2FC9 100%); }
.head { position: absolute; left: 0; right: 0; text-align: center; padding: 0 calc(var(--u) * 7); z-index: 3; }
.eyebrow { display: inline-flex; align-items: center; gap: calc(var(--u) * .9); font: 700 calc(var(--u) * 2.6)/1 "Figtree";
  letter-spacing: .08em; text-transform: uppercase; padding: calc(var(--u) * 1.1) calc(var(--u) * 2); border-radius: 999px;
  background: rgba(255, 255, 255, .12); margin-bottom: calc(var(--u) * 2.6); }
.light .eyebrow { background: rgba(106, 92, 255, .12); color: var(--iris); }
.eyebrow i { width: calc(var(--u) * 1.2); height: calc(var(--u) * 1.2); border-radius: 50%; background: var(--mint); }
h1 { font: 800 calc(var(--u) * 8.6)/1.0 "Bricolage"; letter-spacing: -.035em; }
h1 em { font-style: normal; background: linear-gradient(90deg, #A79FFF, #FF8A78); -webkit-background-clip: text; color: transparent; }
.light h1 em { background: linear-gradient(90deg, #5A4CF0, #E8553F); -webkit-background-clip: text; }
.sub { font: 500 calc(var(--u) * 3.5)/1.3 "Figtree"; opacity: .8; margin-top: calc(var(--u) * 2.4); }

.is-ipad h1 { font-size: calc(var(--u) * 6.4); }
.is-ipad .sub { font-size: calc(var(--u) * 2.7); }
.is-ipad .eyebrow { font-size: calc(var(--u) * 2); }
.is-ipad .feat { font-size: calc(var(--u) * 3); }
.is-ipad .feat small { font-size: calc(var(--u) * 2.3); }
.is-ipad .feat i { width: calc(var(--u) * 7); height: calc(var(--u) * 7); }
/* ---------- toestellen ---------- */
.device { position: absolute; left: 50%; transform: translateX(-50%); z-index: 2; }
.phone { width: calc(var(--u) * 78); aspect-ratio: 440 / 956; border-radius: calc(var(--u) * 11.4); padding: calc(var(--u) * 1.5);
  background: linear-gradient(145deg, #3B3D47, #121318 40%, #2A2C34); box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 14) rgba(0, 0, 0, .55),
  inset 0 0 0 calc(var(--u) * .25) rgba(255, 255, 255, .14); }
.light .phone { box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 14) rgba(40, 30, 120, .35), inset 0 0 0 calc(var(--u) * .25) rgba(255, 255, 255, .2); }
.screen { position: relative; width: 100%; height: 100%; border-radius: calc(var(--u) * 10); overflow: hidden; background: var(--ink); }
.ui { position: absolute; left: 0; top: 0; width: 440px; height: 956px; transform-origin: 0 0; transform: scale(var(--k)); font-family: var(--ui); color: #fff; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 50; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: center;
  padding: 6px 34px 0 46px; font: 600 17px/1 var(--ui); z-index: 40; }
.status .r { display: flex; gap: 6px; align-items: center; }
.status svg { height: 13px; fill: currentColor; }
.homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 146px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .85); z-index: 50; }

.ipad { width: calc(var(--u) * 92); aspect-ratio: 1032 / 1376; border-radius: calc(var(--u) * 5.6); padding: calc(var(--u) * 2.2);
  background: linear-gradient(145deg, #3B3D47, #121318 40%, #2A2C34); box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 14) rgba(0, 0, 0, .5); }
.ipad .screen { border-radius: calc(var(--u) * 3.6); }
.ipad .ui { width: 1032px; height: 1376px; }

/* ---------- Pasr-app ---------- */
.app { position: absolute; inset: 0; background: var(--ink); }
.nav { position: absolute; top: 58px; left: 0; right: 0; height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
.glass { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; background: rgba(255, 255, 255, .1);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
.glass svg { width: 21px; height: 21px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.large { position: absolute; top: 108px; left: 20px; font: 800 34px/1 var(--ui); letter-spacing: -.02em; }
.search { position: absolute; top: 156px; left: 16px; right: 16px; height: 40px; border-radius: 12px; background: rgba(118, 118, 128, .24);
  display: flex; align-items: center; gap: 8px; padding: 0 10px; color: rgba(235, 235, 245, .6); font: 400 17px var(--ui); }
.search svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.stack { position: absolute; left: 16px; right: 16px; top: 214px; }
.pcard { position: absolute; left: 0; width: 408px; height: 257px; border-radius: 16px; overflow: hidden;
  box-shadow: 0 -1px 0 rgba(255, 255, 255, .08) inset, 0 -8px 22px rgba(0, 0, 0, .28); }
.pcard .logo { position: absolute; left: 22px; top: 18px; max-height: 32px; max-width: 170px; object-fit: contain; object-position: left center; }
.pcard .kind { position: absolute; right: 20px; top: 24px; font: 600 12px var(--ui); letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.pcard.lightbg { color: #111; }
.pcard .sheen { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255, 255, 255, .14), transparent 45%); }
.pcard .bottom { position: absolute; left: 22px; right: 22px; bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;
  font: 600 15px var(--ui); }
.pcard .bottom small { display: block; font: 600 11px var(--ui); letter-spacing: .07em; text-transform: uppercase; opacity: .65; margin-bottom: 3px; }

.back { position: absolute; width: 420px; height: 265px; border-radius: 18px; background: #fff; color: #111; overflow: hidden;
  box-shadow: 0 30px 60px rgba(0, 0, 0, .55); }
.back .bar { position: absolute; left: 0; right: 0; top: 0; height: 58px; display: flex; align-items: center; padding: 0 20px; }
.back .bar img { max-height: 28px; max-width: 150px; }
.back .code { position: absolute; left: 36px; right: 36px; top: 76px; height: 132px; display: grid; place-items: center; }
.back .code svg { width: 100%; height: 100%; }
.back .num { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font: 600 17px var(--ui); letter-spacing: .14em; }
.actions { position: absolute; display: flex; gap: 14px; justify-content: center; left: 0; right: 0; }
.actions .glass { width: 54px; height: 54px; border-radius: 27px; }
.actions .glass svg { width: 23px; height: 23px; }
.walletbtn { position: absolute; left: 50%; transform: translateX(-50%); width: 280px; height: 46px; border-radius: 10px; background: #000;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35); display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 16px var(--ui); }
.walletbtn .wi { width: 30px; height: 22px; border-radius: 4px; background: linear-gradient(180deg, #3FB4E9 0 25%, #F5B22A 25% 50%, #F05A5A 50% 75%, #4CC27E 75%); }
.dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .5); backdrop-filter: blur(10px); }

/* scanner */
.camera { position: absolute; inset: 0; background: radial-gradient(70% 50% at 50% 45%, #3A3530, #14120F 75%); }
.held { position: absolute; left: 62px; top: 300px; width: 316px; height: 200px; border-radius: 14px; transform: rotate(-4deg);
  box-shadow: 0 20px 40px rgba(0, 0, 0, .6); overflow: hidden; }
.held .logo { position: absolute; left: 18px; top: 16px; max-height: 26px; }
.held .bc { position: absolute; left: 30px; right: 30px; bottom: 26px; height: 64px; background: #fff; border-radius: 6px; padding: 6px 10px; }
.held .bc svg { width: 100%; height: 100%; }
.frame { position: absolute; left: 44px; top: 268px; width: 352px; height: 264px; }
.frame i { position: absolute; width: 46px; height: 46px; border: 5px solid #fff; }
.frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 16px 0 0 0; }
.frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 16px 0 0; }
.frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 16px; }
.frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 16px 0; }
.found { position: absolute; left: 16px; right: 16px; bottom: 40px; border-radius: 26px; padding: 18px; background: rgba(30, 32, 44, .92);
  backdrop-filter: blur(20px); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1); }
.found .row { display: flex; align-items: center; gap: 14px; }
.tile { width: 58px; height: 58px; border-radius: 14px; display: grid; place-items: center; overflow: hidden; flex: none; }
.tile img { max-width: 44px; max-height: 26px; }
.found b { display: block; font: 700 19px var(--ui); }
.found span { font: 500 15px var(--ui); color: var(--muted); letter-spacing: .06em; }
.btn { margin-top: 16px; height: 52px; border-radius: 26px; background: var(--iris); display: grid; place-items: center; font: 700 17px var(--ui); }
.hint { position: absolute; top: 140px; left: 0; right: 0; text-align: center; font: 600 17px var(--ui); }
.hint small { display: block; font: 500 14px var(--ui); opacity: .7; margin-top: 6px; }
.chiprow { position: absolute; top: 560px; left: 0; right: 0; display: flex; justify-content: center; }
.chiprow span { padding: 8px 14px; border-radius: 99px; background: rgba(46, 211, 166, .2); color: #7DF0CF; font: 700 14px var(--ui); }

/* toegangsscherm */
.lock { position: absolute; inset: 0; background: radial-gradient(80% 60% at 30% 10%, #6A5CFF, transparent 60%),
  radial-gradient(70% 60% at 90% 80%, #FF6B57, transparent 60%), linear-gradient(180deg, #2B2470, #120F2E); }
.lock .date { position: absolute; top: 96px; left: 0; right: 0; text-align: center; font: 600 21px var(--ui); opacity: .9; }
.lock .time { position: absolute; top: 116px; left: 0; right: 0; text-align: center; font: 700 104px/1 "Bricolage"; letter-spacing: -.02em; }
.notif { position: absolute; left: 12px; right: 12px; border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px; align-items: center;
  background: rgba(40, 38, 60, .55); backdrop-filter: blur(24px); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.notif .ico { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; flex: none; }
.notif .ico img { width: 100%; height: 100%; }
.notif .t { flex: 1; min-width: 0; }
.notif .t b { display: block; font: 700 15px var(--ui); }
.notif .t p { font: 400 15px/1.3 var(--ui); opacity: .92; }
.notif time { align-self: flex-start; font: 500 13px var(--ui); opacity: .6; }
.passmini { position: absolute; left: 12px; right: 12px; border-radius: 18px; overflow: hidden; height: 150px; }
.passmini .logo { position: absolute; left: 16px; top: 14px; max-height: 26px; max-width: 150px; }
.passmini .brand { position: absolute; right: 16px; top: 16px; font: 800 16px "Bricolage"; opacity: .85; }
.passmini .f { position: absolute; left: 16px; bottom: 16px; font: 600 12px var(--ui); letter-spacing: .07em; opacity: .75; }
.passmini .f b { display: block; font: 600 20px var(--ui); letter-spacing: .08em; opacity: 1; margin-top: 3px; }

/* voucher */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 70px; background: #16181F; border-radius: 30px 30px 0 0; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .25); margin: 8px auto 0; }
.sheet h3 { font: 700 17px var(--ui); text-align: center; margin-top: 14px; }
.form { position: absolute; left: 16px; right: 16px; }
.group { background: #22252F; border-radius: 14px; margin-bottom: 22px; overflow: hidden; }
.group .r { display: flex; justify-content: space-between; align-items: center; height: 50px; padding: 0 16px; font: 400 17px var(--ui);
  border-bottom: 1px solid rgba(255, 255, 255, .07); }
.group .r:last-child { border-bottom: 0; }
.group .r span { color: var(--muted); }
.group .r b { font-weight: 600; }
.switch { width: 51px; height: 31px; border-radius: 16px; background: #34C759; position: relative; }
.switch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; }
.label { font: 500 13px var(--ui); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 16px 7px; }
.saldo { position: absolute; left: 0; right: 0; text-align: center; }
.saldo small { display: block; font: 600 13px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.saldo b { font: 800 56px/1.1 "Bricolage"; letter-spacing: -.02em; }

/* thuisscherm met widgets */
.home { position: absolute; inset: 0; background: radial-gradient(80% 60% at 20% 0%, #3E35A8, transparent 60%),
  radial-gradient(80% 70% at 100% 100%, #0E6B57, transparent 60%), #0D0C1C; }
.widget { position: absolute; border-radius: 26px; background: rgba(28, 30, 40, .78); backdrop-filter: blur(20px); padding: 16px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1); }
.widget .wh { display: flex; align-items: center; gap: 8px; font: 700 13px var(--ui); opacity: .8; margin-bottom: 10px; }
.widget .wh img { width: 18px; height: 18px; border-radius: 5px; }
.wgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.wgrid .tile { width: 100%; height: 50px; border-radius: 11px; }
.wgrid .tile img { max-width: 52px; max-height: 22px; }
.wbig { height: 100%; border-radius: 18px; overflow: hidden; position: relative; }
.apps { position: absolute; display: grid; grid-template-columns: repeat(4, 64px); gap: 26px 34px; }
.apps i { width: 64px; height: 64px; border-radius: 15px; display: block; }
.dock { position: absolute; left: 14px; right: 14px; bottom: 22px; height: 96px; border-radius: 34px; background: rgba(255, 255, 255, .14);
  display: flex; justify-content: space-around; align-items: center; }
.dock i { width: 64px; height: 64px; border-radius: 15px; display: block; }

/* watch */
.watch { position: absolute; z-index: 4; width: calc(var(--u) * 30); aspect-ratio: 422 / 514; border-radius: calc(var(--u) * 7);
  padding: calc(var(--u) * 1.8); background: linear-gradient(145deg, #C9C3B5, #8D8778 40%, #B9B2A2);
  box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 9) rgba(0, 0, 0, .55); }
.watch::after { content: ""; position: absolute; right: calc(var(--u) * -1.2); top: 28%; width: calc(var(--u) * 1.6); height: 18%;
  border-radius: calc(var(--u) * .6); background: linear-gradient(90deg, #8D8778, #E0DACB); }
.watch .screen { border-radius: calc(var(--u) * 5.4); background: #000; }
.watch .ui { width: 211px; height: 257px; font-family: var(--ui); }
.wui { position: absolute; inset: 0; background: #000; color: #fff; }
.wui .wt { position: absolute; top: 10px; left: 14px; right: 14px; display: flex; justify-content: space-between; font: 700 15px var(--ui); }
.wui .wt span:last-child { font-weight: 500; }
.wcard { position: absolute; left: 8px; right: 8px; height: 56px; border-radius: 12px; overflow: hidden; }
.wcard img { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); max-height: 20px; max-width: 110px; }
.wcode { position: absolute; left: 0; right: 0; top: 30px; bottom: 0; background: #fff; border-radius: 22px 22px 0 0; padding: 14px 12px; color: #111; text-align: center; }
.wcode svg { width: 100%; height: 120px; }
.wcode b { font: 600 13px var(--ui); letter-spacing: .1em; }

/* Face ID */
.lockapp { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 30%, rgba(106, 92, 255, .4), transparent 70%), var(--ink);
  display: grid; place-items: center; }
.faceid { width: 120px; height: 120px; stroke: #fff; fill: none; stroke-width: 4; stroke-linecap: round; }
.lockapp p { font: 700 24px var(--ui); margin-top: 22px; text-align: center; }
.lockapp small { display: block; font: 500 16px var(--ui); color: var(--muted); margin-top: 8px; }
.feats { position: absolute; left: 0; right: 0; display: grid; gap: calc(var(--u) * 2.8); padding: 0 calc(var(--u) * 8); z-index: 3; }
.feat { display: flex; align-items: center; gap: calc(var(--u) * 3); font: 700 calc(var(--u) * 3.9)/1.2 "Figtree"; }
.feat i { width: calc(var(--u) * 9); height: calc(var(--u) * 9); border-radius: calc(var(--u) * 1.8); display: grid; place-items: center; flex: none;
  background: rgba(255, 255, 255, .12); }
.feat i svg { width: 55%; height: 55%; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.feat small { display: block; font: 500 calc(var(--u) * 3)/1.3 "Figtree"; opacity: .75; margin-top: calc(var(--u) * .4); }

/* floating losse kaarten */
.float { position: absolute; z-index: 1; border-radius: calc(var(--u) * 2.6); overflow: hidden; box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(0, 0, 0, .4); }
.float img { position: absolute; left: 9%; top: 12%; max-height: 18%; max-width: 50%; }

/* promo */
.promo-logo { display: flex; align-items: center; gap: calc(var(--u) * 2); }
.promo-logo img { width: calc(var(--u) * 10); height: calc(var(--u) * 10); border-radius: calc(var(--u) * 2.3); }
.promo-logo span { font: 800 calc(var(--u) * 9)/1 "Bricolage"; letter-spacing: -.04em; }
.badge { display: inline-flex; align-items: center; gap: calc(var(--u) * 1); padding: calc(var(--u) * 1.1) calc(var(--u) * 2); border-radius: 999px;
  background: rgba(255, 255, 255, .12); font: 700 calc(var(--u) * 2)/1 "Figtree"; }
</style>
</head>
<body>
<div id="root"></div>
<script src="jsbarcode.min.js"></script>
<script src="qrcode.js"></script>
<script>
const P = new URLSearchParams(location.search);
const W = +P.get("w"), H = +P.get("h"), SCENE = P.get("s"), KIND = P.get("k") || "iphone";
document.documentElement.style.setProperty("--w", W + "px");
document.documentElement.style.setProperty("--h", H + "px");
// eenheid: 1% van de breedte bij staand, van de hoogte bij liggend
const U = (W < H ? W : H * 1.25) / 100;
document.documentElement.style.setProperty("--u", U + "px");

const C = {
  "ah.nl": "#00A0E2", "jumbo.com": "#FFC800", "kruidvat.nl": "#FFFFFF", "ikea.com": "#0058AB", "hema.nl": "#E3191C",
  "action.com": "#FFFFFF", "etos.nl": "#FFFFFF", "gamma.nl": "#003978", "lidl.nl": "#0040A4", "decathlon.nl": "#1482C2",
  "zara.com": "#000000", "bol.com": "#0000A5", "shell.nl": "#FFD500", "primark.com": "#00AEEF", "hm.com": "#FFFFFF",
  "praxis.nl": "#FFDD00", "ns.nl": "#FFC917", "klm.com": "#00A1DE", "open32.nl": "#05141B",
};
const light = (hex) => { const n = parseInt(hex.slice(1), 16); return 0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255) > 160; };
const logo = (d, cls = "logo") => `<img class="${cls}" src="logos/${d}.png">`;
const ICON = {

const card = (d, top, opts = {}) => {
  const c = C[d], lt = light(c);
  return `<div class="pcard ${lt ? "lightbg" : ""}" style="top:${top}px;background:${c};${opts.style || ""}"><div class="sheen"></div>${logo(d)}
    ${opts.kind ? `<span class="kind">${opts.kind}</span>` : ""}
    ${opts.bottom ? `<div class="bottom" style="color:${lt ? "#111" : "#fff"}">${opts.bottom}</div>` : ""}</div>`;
};
function ean(v) {
  const d = v.replace(/\D/g, "").slice(0, 12);
  const sum = [...d].reduce((a, c, i) => a + Number(c) * (i % 2 ? 3 : 1), 0);
  return d + ((10 - (sum % 10)) % 10);
}
function barcodeSVG(value, format = "EAN13", h = 100) {
  if (format === "EAN13") value = ean(value);
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  JsBarcode(s, value, { format, displayValue: false, height: h, margin: 0, width: 3, background: "transparent" });
  s.setAttribute("preserveAspectRatio", "none");
  return s.outerHTML;
}
function qrSVG(text) {
  const q = qrcode(0, "M"); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}

function device(kind, screen, style = "") {
  if (kind === "watch") {
    return `<div class="watch" style="${style}"><div class="screen"><div class="ui" style="--k:var(--wk)">${SCREENS[screen]()}</div></div></div>`;
  }
  if (kind === "ipad") {
    // iPad: dezelfde app, kaarten in het midden (zoals Pasr op de iPad), achtergrond over het hele scherm
    const inner = SCREENS[screen]().replace('<div class="island"></div>', "").replace('<div class="homebar"></div>', "");
    const bg = screen === "lockscreen" ? "lock" : screen === "widgets" ? "home" : screen === "scan" ? "camera" : screen === "faceid" ? "lockapp" : "app";
    return `<div class="device ipad" style="${style}"><div class="screen"><div class="ui"><div class="${bg}"></div>
      <div style="position:absolute;left:${(1032 - 440 * 1.42) / 2}px;top:20px;width:440px;height:956px;transform:scale(1.42);transform-origin:0 0">${inner}</div>
      <div class="homebar" style="width:300px"></div></div></div></div>`;
  }
  return `<div class="device phone" style="${style}"><div class="screen"><div class="ui">${SCREENS[screen]()}</div></div></div>`;
}

function marketing(sc, kind) {
  const ipad = kind === "ipad";
  let html = `<div class="canvas ${sc.bg} ${ipad ? "is-ipad" : ""}">`;
  html += `<div class="head" style="top:${ipad ? 4.6 : 5.6}%"><div class="eyebrow"><i></i>${sc.eyebrow}</div><h1>${sc.title}</h1>${sc.sub ? `<p class="sub">${sc.sub}</p>` : ""}</div>`;
  if (sc.screen === "stack") html += floatCard("klm.com", -6, 30, 22, -14) + floatCard("ns.nl", 84, 34, 22, 12);
  if (sc.feats) {
    html += `<div class="feats" style="top:${ipad ? 20 : 24}%;${ipad ? "padding:0 calc(var(--u) * 14)" : ""}">
      <div class="feat"><i>${ICON.nosign}</i><div>Geen reclame, geen tracking<small>We verkopen niets en kijken niet mee.</small></div></div>
      <div class="feat"><i>${ICON.cloud}</i><div>In je eigen iCloud<small>Of in een versleuteld Pasr-account, als je wilt.</small></div></div>
      <div class="feat"><i>${ICON.shield}</i><div>Vergrendel met Face ID<small>Per kaart of de hele app.</small></div></div>
      <div class="feat"><i>${ICON.euro}</i><div>Helemaal gratis<small>Geen abonnement, geen premium.</small></div></div></div>`;
    html += device(kind, sc.screen, `top:${ipad ? 58 : 66}%;width:calc(var(--u) * ${ipad ? 62 : 70})`);
  } else {
    html += device(kind, sc.screen, `top:${ipad ? 25 : 29}%;width:calc(var(--u) * ${ipad ? 84 : 82})`);
  }
  if (sc.watch) html += device("watch", sc.watch, `left:${ipad ? 74 : 66}%;top:${ipad ? 62 : 66}%;transform:rotate(-6deg)`);
  return html + "</div>";
}

const root = document.getElementById("root");

  document.documentElement.style.setProperty("--wk", W / 211);
  root.innerHTML = `<div style="position:relative;width:${W}px;height:${H}px;overflow:hidden"><div class="ui" style="--k:${W / 211};width:211px;height:${H / (W / 211)}px">${SCREENS[SCENE]()}</div></div>`;
} else if (KIND === "promo") {
  root.innerHTML = promo();
} else {
  root.innerHTML = marketing(SCENES[SCENE], KIND);
}
// schaal de app binnen het toestel
requestAnimationFrame(() => {
  document.querySelectorAll(".screen").forEach((s) => {
    const ui = s.querySelector(".ui");
    const base = s.closest(".watch") ? 211 : s.closest(".ipad") ? 1032 : 440;
    ui.style.setProperty("--k", s.clientWidth / base);
  });
  document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
});
